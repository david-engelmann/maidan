apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maidan

resources:
  - ../../base

commonAnnotations:
  maidan.dev/environment: "prod"

# The release every prod deploy path pins (scripts/check-deploy-pins.sh fails
# when they differ from the newest tagged CHANGELOG section). Both images are
# published by release.yml under the same tag. Better still, pin digests
# (`digest: sha256:…`, see ../../README.md).
images:
  - name: maidan-server
    newName: ghcr.io/david-engelmann/maidan-server
    newTag: v412.0.0
  - name: maidan-postgres
    newName: ghcr.io/david-engelmann/maidan-postgres
    newTag: v412.0.0

# Production deployments scale wider, expose via a real host, and
# tighten resource limits.
patches:
  - target:
      kind: Deployment
      name: maidan-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 2
            memory: 1Gi
  - target:
      kind: Ingress
      name: maidan-server
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: maidan.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - maidan.example.com
            secretName: maidan-tls
