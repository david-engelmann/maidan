apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maidan

resources:
  - ../../base

commonAnnotations:
  maidan.dev/environment: "prod"

# Override these with the actual production image tags (semver release
# tag, not 'dev'). Recommended: pin to digest in CI/CD.
images:
  - name: maidan-server
    newName: ghcr.io/david-engelmann/maidan-server
    newTag: v0.0.1
  - name: maidan-postgres
    newName: ghcr.io/david-engelmann/maidan-postgres
    newTag: v0.0.1

# Production deployments scale wider, expose via a real host, and
# tighten resource limits.
patches:
  - target:
      kind: Deployment
      name: maidan-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 2
            memory: 1Gi
  - target:
      kind: Ingress
      name: maidan-server
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: maidan.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - maidan.example.com
            secretName: maidan-tls
