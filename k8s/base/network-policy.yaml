# Restrict maidan-server ingress to in-namespace callers and ingress controller,
# and egress to DNS plus the in-namespace Postgres/MinIO datastores. Adjust
# namespaceSelector for your ingress controller installation (Track V.4).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maidan-server
  namespace: maidan
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maidan
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    # Cluster DNS (CoreDNS / kube-dns).
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # In-namespace datastores the server is expected to reach.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: maidan
              app.kubernetes.io/component: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: maidan
              app.kubernetes.io/component: minio
      ports:
        - port: 9000
          protocol: TCP
