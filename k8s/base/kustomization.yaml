apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maidan

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - minio-statefulset.yaml
  - minio-service.yaml
  - maidan-server-deployment.yaml
  - maidan-server-service.yaml
  - maidan-server-ingress.yaml
  - network-policy.yaml

commonLabels:
  app.kubernetes.io/name: maidan
  app.kubernetes.io/part-of: maidan

images:
  - name: maidan-server
    newTag: dev
  - name: maidan-postgres
    newTag: dev
