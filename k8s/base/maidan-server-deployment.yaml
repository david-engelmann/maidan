apiVersion: apps/v1
kind: Deployment
metadata:
  name: maidan-server
  namespace: maidan
  labels:
    app.kubernetes.io/name: maidan
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: maidan
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maidan
        app.kubernetes.io/component: server
    spec:
      # Kubernetes would otherwise inject MAIDAN_<SERVICE>_PORT and friends for
      # every Service named maidan-*, which the server would read as unknown
      # configuration.
      enableServiceLinks: false
      # The server drains for MAIDAN_SHUTDOWN_DRAIN_SECS (configmap) after
      # SIGTERM; this covers that plus in-flight requests.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maidan-server
          image: maidan-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: maidan-config
            - secretRef:
                name: maidan-secrets
          # Required: without the content KEK in maidan-secrets the pod does not
          # start (CreateContainerConfigError). See secret.example.yaml.
          env:
            - name: MAIDAN_CONTENT_KEK
              valueFrom:
                secretKeyRef:
                  name: maidan-secrets
                  key: MAIDAN_CONTENT_KEK
          volumeMounts:
            - name: artifact-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: artifact-data
          emptyDir: {}
