apiVersion: apps/v1
kind: Deployment
metadata:
  name: maidan-server
  namespace: maidan
  labels:
    app.kubernetes.io/name: maidan
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: maidan
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maidan
        app.kubernetes.io/component: server
    spec:
      # Kubernetes would otherwise inject MAIDAN_<SERVICE>_PORT and friends for
      # every Service named maidan-*, which the server would read as unknown
      # configuration.
      enableServiceLinks: false
      # The server drains for MAIDAN_SHUTDOWN_DRAIN_SECS (configmap) after
      # SIGTERM; this covers that plus in-flight requests.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        # The server's group (uid and gid 65532 in the image) owns the secret
        # files below, which no one else can read.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maidan-server
          image: maidan-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: maidan-config
          # Secrets are files under /run/secrets/maidan, never environment
          # variables, and each <KEY>_FILE names one. The mount below lists every
          # key, so maidan-secrets without one stops the pod before the server
          # starts. Add a secret by adding it to both lists (secret.example.yaml).
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/maidan/DATABASE_URL
            - name: MAIDAN_CONTENT_KEK_FILE
              value: /run/secrets/maidan/MAIDAN_CONTENT_KEK
            # Uncomment with the matching items below when maidan-secrets holds
            # them: a KEK rotation, or an S3-compatible artifact backend.
            # - name: MAIDAN_CONTENT_KEK_PREVIOUS_FILE
            #   value: /run/secrets/maidan/MAIDAN_CONTENT_KEK_PREVIOUS
            # - name: S3_ACCESS_KEY_ID_FILE
            #   value: /run/secrets/maidan/S3_ACCESS_KEY_ID
            # - name: S3_SECRET_ACCESS_KEY_FILE
            #   value: /run/secrets/maidan/S3_SECRET_ACCESS_KEY
          volumeMounts:
            - name: artifact-data
              mountPath: /data
            - name: secret-files
              mountPath: /run/secrets/maidan
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: artifact-data
          emptyDir: {}
        - name: secret-files
          secret:
            secretName: maidan-secrets
            defaultMode: 0440
            items:
              - key: DATABASE_URL
                path: DATABASE_URL
              - key: MAIDAN_CONTENT_KEK
                path: MAIDAN_CONTENT_KEK
              # - key: MAIDAN_CONTENT_KEK_PREVIOUS
              #   path: MAIDAN_CONTENT_KEK_PREVIOUS
              # - key: S3_ACCESS_KEY_ID
              #   path: S3_ACCESS_KEY_ID
              # - key: S3_SECRET_ACCESS_KEY
              #   path: S3_SECRET_ACCESS_KEY
