# Template for the maidan-secrets Secret. **Never** commit a populated
# copy of this file. Production deployments should source these values
# from sealed-secrets, external-secrets, or a CSI secret provider.
#
# To use as a starting point in a dev cluster, base64-encode each value:
#
#   echo -n "postgres://maidan:maidan@maidan-postgres:5432/maidan" | base64
#
# and supply the resulting blobs via `kubectl create secret generic` or a
# Secret resource applied out-of-band.

apiVersion: v1
kind: Secret
metadata:
  name: maidan-secrets
  namespace: maidan
  labels:
    app.kubernetes.io/name: maidan
type: Opaque
data:
  # The server reads each key here as a file (maidan-server-deployment.yaml
  # mounts them under /run/secrets/maidan and names each in <KEY>_FILE). A key
  # added here is added to that volume's items and as <KEY>_FILE too, and a key
  # the volume lists but this Secret lacks stops the pod. Settings that are not
  # secret (S3_ENDPOINT, S3_BUCKET, S3_REGION, OTLP_ENDPOINT) go in maidan-config.
  #
  # Required:
  # DATABASE_URL: <base64>
  # Required (wraps message content keys; `openssl rand -hex 32`;
  # docs/Production.md, Crypto-shredding):
  # MAIDAN_CONTENT_KEK: <base64>
  # During a KEK rotation only:
  # MAIDAN_CONTENT_KEK_PREVIOUS: <base64>
  # Optional, for an S3-compatible artifact backend:
  # S3_ACCESS_KEY_ID: <base64>
  # S3_SECRET_ACCESS_KEY: <base64>
  DATABASE_URL: ""
