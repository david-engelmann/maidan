# Template for the maidan-secrets Secret. **Never** commit a populated
# copy of this file. Production deployments should source these values
# from sealed-secrets, external-secrets, or a CSI secret provider.
#
# To use as a starting point in a dev cluster, base64-encode each value:
#
#   echo -n "postgres://maidan:maidan@maidan-postgres:5432/maidan" | base64
#
# and supply the resulting blobs via `kubectl create secret generic` or a
# Secret resource applied out-of-band.

apiVersion: v1
kind: Secret
metadata:
  name: maidan-secrets
  namespace: maidan
  labels:
    app.kubernetes.io/name: maidan
type: Opaque
data:
  # Required:
  # DATABASE_URL: <base64>
  # Optional (S3-compatible artifact backend; future cluster):
  # S3_ENDPOINT: <base64>
  # S3_BUCKET: <base64>
  # S3_REGION: <base64>
  # S3_ACCESS_KEY_ID: <base64>
  # S3_SECRET_ACCESS_KEY: <base64>
  # Optional (OTLP exporter):
  # OTLP_ENDPOINT: <base64>
  DATABASE_URL: ""
