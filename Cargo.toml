[workspace]
resolver = "2"
members = [
    "crates/maidan-types",
    "crates/maidan-store",
    "crates/maidan-bus",
    "crates/maidan-search",
    "crates/maidan-fsm",
    "crates/maidan-router",
    "crates/maidan-auth",
    "crates/maidan-artifacts",
    "crates/maidan-mcp",
    "crates/maidan-a2a",
    "crates/maidan-observability",
    "crates/maidan-cli",
    "crates/maidan-server",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/david-engelmann/maidan"
authors = ["David Engelmann"]
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
bytes = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "json", "macros"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

[profile.test]
opt-level = 0
debug = true
