# Seat runner config. Copy to seats.toml and fill in the workspace and repos.
# The numbers below are cautious starting points for a small machine.
# Tune them for yours.
seats = 1               # tune this: session seats claiming at once
idle_secs = 60          # wait after a run that did no work
kill_grace_secs = 10    # SIGTERM, then SIGKILL after this many seconds

[maidan]
url = "http://127.0.0.1:8080"   # use https for anything that is not loopback
workspace_id = "00000000-0000-0000-0000-000000000000"
token_env = "MAIDAN_TOKEN"   # the seat token is read from this variable, never from here
# Other variables that must never reach the repository's preflight commands.
secret_env = []
lease_secs = 3600            # also bounds how long a crashed runner's claim stays held
timeout_secs = 60            # give up on a request after this long without an answer
claim_attempts = 3           # tries for claim-next and acknowledge, under one Idempotency-Key
claim_backoff_secs = 2       # doubled after each try, unless the server sends Retry-After
release_attempts = 4         # tries for a release the server did not answer
release_backoff_secs = 2     # doubled after each try

[harness]
# codex (Codex CLI), claude (Claude Code) or gemini (Gemini CLI). README.md,
# "Harnesses", has each command line; the other two are commented out below.
name = "codex"
models = ["example-model"]   # the models this runner may start; `model` must be one
model = "example-model"
# Who serves the model. Maidan reads the family (here openai) from it and the
# model; second-family review routes on it. Defaults: codex openai, claude
# anthropic, gemini google. `family` defaults to what Maidan reads, and a
# config that says otherwise is refused.
# provider = "openai"
pass_token = true            # Codex's MCP config reads the token from token_env
# bin = "codex"
# prompt = "examples/seat-runner/prompt.md"
# A prompt per task kind; a review thread runs the red-team runbook.
# prompts = { review = "examples/seat-runner/review-prompt.md" }

# A Claude Code seat on an Anthropic plan:
#   name = "claude"
#   models = ["claude-sonnet-5"]
#   model = "claude-sonnet-5"
#   allowed_domains = ["maidan.example.com", "github.com"]   # sandboxed Bash's network; default: the Maidan host
#
# A GLM coding-plan seat: Claude Code pointed at z.ai. The key is read from
# the variable env_from names, never from this file:
#   name = "claude"
#   provider = "z.ai"          # required: Maidan reads z.ai and glm-… as zhipu
#   models = ["glm-5.3"]
#   model = "glm-5.3"
#   env = { ANTHROPIC_BASE_URL = "https://api.z.ai/api/anthropic", API_TIMEOUT_MS = "3000000" }
#   env_from = { ANTHROPIC_AUTH_TOKEN = "ZAI_API_KEY" }
#
# A Google AI plan seat on Gemini CLI, signed in as the plan's account (or
# env_from = { GEMINI_API_KEY = "SOME_VAR" } for an API key):
#   name = "gemini"
#   models = ["gemini-3-pro"]
#   model = "gemini-3-pro"
#
# A GLM coding-plan seat on ZCode, Z.ai's own CLI (built from source; README.md,
# "ZCode"). No sandbox, so it runs --mode guarded and its repos take no
# writable_roots. The key is read from the variable api_key_env names:
#   name = "zcode"
#   bin = ["node", "/abs/ZCode/apps/zcode-cli/packages/cli/dist/zcode.cjs"]
#   models = ["glm-5.3"]
#   model = "glm-5.3"
#   api_key_env = "ZAI_API_KEY"
#   # api_type = "anthropic-messages"
#   # api_base_url = "https://api.z.ai/api/anthropic"
#
# claude, gemini and zcode: the Maidan endpoint (/mcp/streamable, /mcp/worker or
# /mcp/reviewer; the runbooks need /mcp/streamable), and where a gemini or zcode
# run's 0600 files go (a 0700 directory per run, outside every checkout,
# removed after it).
# mcp_path = "/mcp/streamable"
# state_dir = "/tmp/maidan-seat-runner"

[caps]
# `capped` ships in this repository (scripts/capped). It runs a command under
# a wall-clock and memory cap and exits 124 when the time cap fired and 137
# when the memory cap fired.
capped = "scripts/capped"
run_secs = 3600              # tune this
run_mem_gb = 8               # tune this
preflight_secs = 600         # tune this
preflight_mem_gb = 4         # tune this

[host]
# Defaults when unset: max_load15 = the CPU count, min_free_gb = 5.
max_load15 = 4               # tune this: skip a run while the 15-minute load is at or over this
min_free_gb = 5              # tune this: skip a run while the checkout's disk has less free

[[repos]]
repo = "owner/name"
checkout = "~/src/name"
# The toolchain's version, then the repository's own narrow check.
preflight = [["cargo", "--version"], ["cargo", "test", "-p", "smallest-crate", "--lib", "-q"]]
# Shared build state outside the checkout that the harness sandbox must write.
writable_roots = []
