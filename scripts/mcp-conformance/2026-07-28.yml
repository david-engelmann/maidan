# Expected failures for scripts/mcp-conformance.sh under the 2026-07-28 requirements,
# grouped by reason. Each entry is one check (<scenario>:<check-id>). A listed check
# that starts passing fails the run, so an entry goes the moment its reason does.
# Baselined against @modelcontextprotocol/conformance 0.2.0-alpha.11 on 2026-10-07.
