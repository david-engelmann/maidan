# Production ingress with cert-manager. Layer it on values-prod.yaml, which names
# the release image:
#   -f values-prod.yaml -f values-cert-manager.yaml
# Alone it refuses to render rather than deploy the development image.
# Requires cert-manager + a ClusterIssuer named below.
production: true
replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
  hosts:
    - host: maidan.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: maidan-tls
      hosts:
        - maidan.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

persistence:
  enabled: true
  size: 50Gi
