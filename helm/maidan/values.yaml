replicaCount: 1

# Distroless `nonroot` image (UID/GID 65532). Numeric IDs are required when
# `runAsNonRoot` is set — named users in the image cannot be verified.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  runAsNonRoot: true

# Set by the prod values files. A production render refuses the development
# image below (`maidan-server:dev`) and needs a release tag or a digest.
production: false

image:
  repository: maidan-server
  tag: dev
  # `sha256:…`. When set, the image is pulled by digest and `tag` is ignored.
  digest: ""
  pullPolicy: IfNotPresent

# On SIGTERM the server fails readiness and keeps serving for
# MAIDAN_SHUTDOWN_DRAIN_SECS so the Service stops routing to it before the
# listener closes; this must exceed that plus the longest request you expect to
# finish (long-poll MCP tools wait up to 330 s — they are cut here, and clients
# retry).
terminationGracePeriodSeconds: 45

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: maidan.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  MAIDAN_BIND: "0.0.0.0:8080"
  MAIDAN_LOG: "info,sqlx=warn"
  ARTIFACT_BACKEND: "localfs"
  ARTIFACT_LOCALFS_ROOT: "/data/artifacts"
  MAIDAN_SHUTDOWN_DRAIN_SECS: "10"

# Development default. A production render (`production: true`) refuses it,
# and any value holding the placeholder CHANGE_ME, with a message naming what to
# set; prefer `existingSecret` there.
secrets:
  DATABASE_URL: "postgres://maidan:maidan@postgres:5432/maidan"

# Content key-encryption key (KEK): 32 bytes, 64 hex characters or base64
# (`openssl rand -hex 32`). It wraps the per-message keys that make withdrawn
# messages unreadable (docs/Production.md, Crypto-shredding). Required: the
# chart refuses to render without it unless `existingSecret` is set, and that
# Secret must then hold `MAIDAN_CONTENT_KEK`. Prefer `existingSecret` or
# `--set contentKek=…` from your secret manager over a values file.
contentKek: ""
# Retired KEKs during a rotation (comma-separated); drop them once rewrapped.
contentKekPrevious: ""

# Reference a pre-created Secret (holding DATABASE_URL, MAIDAN_CONTENT_KEK and
# any other runtime secrets) instead of rendering one from `.Values.secrets`.
# When set, the chart creates no Secret of its own and mounts this one via
# envFrom. Keeps secret material out of values files / release history.
existingSecret: ""

# More envFrom sources, read after the chart's ConfigMap and Secret, so a key
# in one of them overrides `config` and `secrets`. Names go through tpl, so a
# parent chart can name its release's resources: maidan-stack points this at
# the Secret that connects the server to its bundled Postgres and MinIO. The
# render cannot see what these sources hold, so, as with `existingSecret`, a
# production render does not check `secrets.DATABASE_URL` when this is set.
extraEnvFrom: []

# Health probes. Startup + liveness hit the SHALLOW /health/live (process
# alive); readiness hits the DEEP /health/ready (dependencies OK) so a degraded
# dependency drains traffic instead of restart-storming the pod.
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 30   # up to ~150s of startup grace (migrations, warmup)
  liveness:
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    failureThreshold: 3

# Keep a minimum number of pods available during voluntary disruptions (node
# drains, rollouts). Enable with replicaCount > 1 or autoscaling.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""   # set one of the two; maxUnavailable wins when non-empty

# Opt-in NetworkPolicy. Safe by default (open egress so datastores work); tighten
# ingress with `ingressFrom`, and egress by setting `allowAllEgress: false` +
# populating `egress`.
networkPolicy:
  enabled: false
  ingressFrom: []      # e.g. [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
  allowAllEgress: true
  egress: []           # used when allowAllEgress is false (DNS is always allowed)

persistence:
  enabled: true
  size: 10Gi
