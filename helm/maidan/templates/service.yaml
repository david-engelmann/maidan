apiVersion: v1
kind: Service
metadata:
  name: {{ include "maidan.fullname" . }}
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if or .Values.production (hasKey .Values.config "MAIDAN_METRICS_BIND") }}
    - port: {{ .Values.service.metricsPort | default 9091 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "maidan.selectorLabels" . | nindent 4 }}
