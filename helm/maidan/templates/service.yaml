{{- if and .Values.production (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) }}
{{- fail (printf "service.type %q is not allowed in production: use ClusterIP behind an Ingress" .Values.service.type) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "maidan.fullname" . }}
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "maidan.selectorLabels" . | nindent 4 }}
