{{- if .Values.networkPolicy.enabled }}
{{- if .Values.networkPolicy.allowAllEgress }}
{{- fail "networkPolicy.allowAllEgress must be false when networkPolicy is enabled; set egress (DNS is always allowed)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "maidan.fullname" . }}
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "maidan.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Reach the HTTP port. With no `from` (default `ingressFrom: []`) any source
    # may connect on the service port only; add namespace/pod selectors to
    # restrict to your ingress controller.
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS is always allowed so the pod can resolve its datastore hosts.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # allowAllEgress is refused above; only the explicit egress list remains.
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
