apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "maidan.fullname" . }}-config
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
data:
  {{- /* Through tpl, so a value can name the release: the stack's S3_ENDPOINT. */}}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ tpl (toString $v) $ | quote }}
  {{- end }}
  {{- if and .Values.production (not (hasKey .Values.config "MAIDAN_METRICS_BIND")) (not (hasKey .Values.config "MAIDAN_METRICS_TOKEN")) }}
  MAIDAN_METRICS_BIND: "0.0.0.0:9091"
  {{- end }}
