{{- if .Values.persistence.enabled }}
{{- $size := toString .Values.persistence.size }}
{{- if or (eq $size "") (eq $size "0") (eq $size "0Gi") (eq $size "0Mi") }}
{{- fail "persistence.size must be a positive Kubernetes quantity (for example 10Gi)" }}
{{- end }}
{{- if not (regexMatch "^(0?\\.[0-9]*[1-9][0-9]*|[1-9][0-9]*(\\.[0-9]+)?)(k|M|G|T|P|E|Ki|Mi|Gi|Ti|Pi|Ei)?$" $size) }}
{{- fail (printf "persistence.size %q is not a valid Kubernetes quantity" $size) }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "maidan.fullname" . }}-data
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $size }}
{{- end }}
