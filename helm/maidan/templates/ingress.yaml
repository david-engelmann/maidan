{{- if .Values.ingress.enabled }}
{{- if and .Values.production (not .Values.ingress.tls) }}
{{- fail "a production ingress needs tls: set ingress.tls (secretName + hosts)" }}
{{- end }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.hosts is empty: name at least one host" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "maidan.fullname" . }}
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - secretName: {{ required "ingress.tls[].secretName is required" .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- if not .host }}
    {{- fail "ingress.hosts[].host is empty" }}
    {{- end }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- if and (ne .pathType "Prefix") (ne .pathType "Exact") }}
          {{- fail (printf "ingress pathType %q must be Prefix or Exact" .pathType) }}
          {{- end }}
          - path: {{ required "ingress path is required" .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "maidan.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
