{{- include "maidan.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maidan.fullname" . }}
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "maidan.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "maidan.selectorLabels" . | nindent 8 }}
    spec:
      # Kubernetes would otherwise inject MAIDAN_<SERVICE>_PORT and friends for
      # every Service named maidan-*, which the server would read as unknown
      # configuration.
      enableServiceLinks: false
      # Covers the server's drain (MAIDAN_SHUTDOWN_DRAIN_SECS) plus in-flight
      # requests; past it the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maidan-server
          image: {{ include "maidan.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "maidan.fullname" . }}-config
            {{- if not .Values.secretFiles.enabled }}
            - secretRef:
                name: {{ include "maidan.secretName" . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.secretFiles.enabled }}
            # Each secret is a file under /run/secrets/maidan, named here. The
            # mount lists every key, so a Secret without one (the content KEK
            # included) stops the pod before the server starts.
            {{- range (include "maidan.secretFileSources" . | fromJsonArray) }}
            {{- range .keys }}
            - name: {{ . }}_FILE
              value: /run/secrets/maidan/{{ . }}
            {{- end }}
            {{- end }}
            {{- else }}
            # Named explicitly so a Secret without the content KEK stops the pod
            # (CreateContainerConfigError) instead of starting a server that cannot
            # seal message content.
            - name: MAIDAN_CONTENT_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ include "maidan.secretName" . }}
                  key: MAIDAN_CONTENT_KEK
            {{- end }}
          volumeMounts:
            - name: artifact-data
              mountPath: /data
            {{- if .Values.secretFiles.enabled }}
            - name: secret-files
              mountPath: /run/secrets/maidan
              readOnly: true
            {{- end }}
          # Startup + liveness use the SHALLOW /health/live (process alive);
          # readiness uses the DEEP /health/ready (dependencies OK). This keeps a
          # degraded dependency (DB blip) from failing liveness and triggering a
          # restart storm — the pod drains from Service endpoints instead, and
          # recovers when the dependency does.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: artifact-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "maidan.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.secretFiles.enabled }}
        # Readable by the server's group (fsGroup), by no one else.
        - name: secret-files
          projected:
            defaultMode: 0440
            sources:
              {{- range (include "maidan.secretFileSources" . | fromJsonArray) }}
              - secret:
                  name: {{ .name }}
                  items:
                    {{- range .keys }}
                    - key: {{ . }}
                      path: {{ . }}
                    {{- end }}
              {{- end }}
        {{- end }}
