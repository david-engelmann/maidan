{{- if hasKey .Values.secrets "MAIDAN_CONTENT_KEK" }}
{{- fail "set contentKek (or existingSecret), not secrets.MAIDAN_CONTENT_KEK" }}
{{- end }}
{{- if not .Values.existingSecret }}
{{- $kek := required "contentKek is required (openssl rand -hex 32), or set existingSecret to a Secret holding MAIDAN_CONTENT_KEK" .Values.contentKek }}
{{- if contains "CHANGE_ME" (toString $kek) }}
{{- fail "contentKek still holds the placeholder CHANGE_ME: set openssl rand -hex 32 (or existingSecret)" }}
{{- end }}
{{- if lt (len (toString $kek)) 32 }}
{{- fail "contentKek is too short: need 32 bytes as 64 hex chars or base64 (openssl rand -hex 32)" }}
{{- end }}
{{- range $k, $v := .Values.secrets }}
{{- if or (eq (toString $v) "") (contains "CHANGE_ME" (toString $v)) }}
{{- fail (printf "secrets.%s is empty or still holds CHANGE_ME" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maidan.fullname" . }}-secrets
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  MAIDAN_CONTENT_KEK: {{ $kek | quote }}
  {{- with .Values.contentKekPrevious }}
  {{- if contains "CHANGE_ME" (toString .) }}
  {{- fail "contentKekPrevious still holds the placeholder CHANGE_ME" }}
  {{- end }}
  MAIDAN_CONTENT_KEK_PREVIOUS: {{ . | quote }}
  {{- end }}
{{- end }}
