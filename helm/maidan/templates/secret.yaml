{{- if hasKey .Values.secrets "MAIDAN_CONTENT_KEK" }}
{{- fail "set contentKek (or existingSecret), not secrets.MAIDAN_CONTENT_KEK" }}
{{- end }}
{{- if not .Values.existingSecret }}
{{- $kek := required "contentKek is required (openssl rand -hex 32), or set existingSecret to a Secret holding MAIDAN_CONTENT_KEK" .Values.contentKek }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maidan.fullname" . }}-secrets
  labels:
    {{- include "maidan.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  MAIDAN_CONTENT_KEK: {{ $kek | quote }}
  {{- with .Values.contentKekPrevious }}
  MAIDAN_CONTENT_KEK_PREVIOUS: {{ . | quote }}
  {{- end }}
{{- end }}
