replicaCount: 2

image:
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: maidan.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: maidan-tls
      hosts:
        - maidan.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

# Keep at least one pod serving during node drains / rollouts (replicaCount ≥ 2).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# NetworkPolicy is opt-in and cluster-specific — enable it and set `ingressFrom`
# to your ingress controller's namespace, then lock egress down to your
# datastores (`allowAllEgress: false` + `egress`).
# networkPolicy:
#   enabled: true

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

persistence:
  enabled: true
  size: 50Gi
