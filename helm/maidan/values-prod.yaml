replicaCount: 2

# The base values.yaml ships `maidan-server:dev` for local kind installs, so a
# production overlay has to name a real image or it deploys the dev tag from an
# unqualified repository. Set `image.tag` to the release you intend to run —
# better still, a digest (`@sha256:…`) via `--set image.tag`.
#
# `IfNotPresent`, not `Always`: with a pinned tag there is nothing to re-pull,
# and `Always` on a mutable tag means a pod restart can silently change the
# running version without a deploy.
image:
  repository: ghcr.io/david-engelmann/maidan-server
  tag: v402.0.0
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: maidan.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: maidan-tls
      hosts:
        - maidan.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

# Keep at least one pod serving during node drains / rollouts (replicaCount ≥ 2).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# NetworkPolicy is opt-in and cluster-specific — enable it and set `ingressFrom`
# to your ingress controller's namespace, then lock egress down to your
# datastores (`allowAllEgress: false` + `egress`).
# networkPolicy:
#   enabled: true

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

persistence:
  enabled: true
  size: 50Gi
