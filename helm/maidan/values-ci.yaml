# Kind / CI smoke: local image, SQLite on PVC. The content KEK is passed at
# install time (scripts/helm-install-kind-smoke.sh), which also checks that the
# dev admin token below resolves.
replicaCount: 1

image:
  repository: maidan-server
  tag: dev
  pullPolicy: Never

ingress:
  enabled: false

autoscaling:
  enabled: false

persistence:
  enabled: true
  size: 1Gi

config:
  MAIDAN_BIND: "0.0.0.0:8080"
  MAIDAN_LOG: "info,sqlx=warn"
  # Opens the first workspace with this admin token, so the smoke can make an
  # authenticated call. In config, not secrets: the server reads it only from
  # the environment, and it is a published CI value, not a secret.
  MAIDAN_DEV_ADMIN_TOKEN: "maidan-dev-admin-token-local-stacks-only"
  ARTIFACT_BACKEND: localfs
  ARTIFACT_LOCALFS_ROOT: "/data/artifacts"

secrets:
  DATABASE_URL: "sqlite:///data/maidan.db?mode=rwc"
