# Umbrella production bundle: Postgres + MinIO + Maidan with TLS ingress.
postgresql:
  enabled: true
  auth:
    username: maidan
    password: "" # set via --set or external secret
    database: maidan
  primary:
    persistence:
      enabled: true
      size: 20Gi

minio:
  enabled: true
  auth:
    rootUser: minio
    rootPassword: "" # set via --set or external secret
  defaultBuckets: maidan-artifacts
  persistence:
    enabled: true
    size: 50Gi

maidan:
  replicaCount: 2
  # The chart refuses a production render without a release tag or digest, so
  # this names both the registry and the release (the same pin as
  # helm/maidan/values-prod.yaml; scripts/check-deploy-pins.sh keeps them equal).
  # Prefer `--set maidan.image.digest=sha256:…`. `IfNotPresent`: a pinned tag
  # has nothing to re-pull, and `Always` on a re-pointed tag would change the
  # running version on a pod restart.
  production: true
  image:
    repository: ghcr.io/david-engelmann/maidan-server
    tag: v412.0.0
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: maidan.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: maidan-tls
        hosts:
          - maidan.example.com
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
  config:
    MAIDAN_BIND: "0.0.0.0:8080"
    ARTIFACT_BACKEND: s3
    # The Bitnami MinIO Service is <release>-minio.
    S3_ENDPOINT: "http://{{ .Release.Name }}-minio:9000"
    S3_BUCKET: maidan-artifacts
    S3_REGION: us-east-1
  # Without `maidan.existingSecret` the render refuses until these are set.
  # With it, create a Secret holding DATABASE_URL, S3_ACCESS_KEY_ID,
  # S3_SECRET_ACCESS_KEY and MAIDAN_CONTENT_KEK before install (preferred: it
  # keeps them out of the release history). The render does not check that
  # Secret or its keys.
  secrets:
    # postgres://maidan:<postgresql.auth.password>@<release>-postgresql:5432/maidan
    DATABASE_URL: ""
    S3_ACCESS_KEY_ID: minio
    # minio.auth.rootPassword
    S3_SECRET_ACCESS_KEY: ""
