# Umbrella production bundle: Postgres + MinIO + Maidan with TLS ingress.
# The server connects to both stores by itself (<release>-datastores), so
# maidan.secrets needs no DATABASE_URL or S3 keys. The render refuses until the
# two passwords are set (`--set postgresql.auth.password=…
# --set minio.auth.rootPassword=…`, e.g. from `openssl rand -hex 24`), and
# until maidan.contentKek or maidan.existingSecret is.
postgresql:
  enabled: true
  # The same release as maidan.image (scripts/check-deploy-pins.sh keeps them
  # equal); release.yml publishes both. Prefer
  # `--set postgresql.image.digest=sha256:…`.
  image:
    repository: ghcr.io/david-engelmann/maidan-postgres
    tag: v412.0.0
    pullPolicy: IfNotPresent
  auth:
    username: maidan
    password: "" # set via --set or your secret manager
    database: maidan
  primary:
    persistence:
      enabled: true
      size: 20Gi

minio:
  enabled: true
  auth:
    rootUser: minio
    rootPassword: "" # set via --set or your secret manager
  defaultBuckets: maidan-artifacts
  persistence:
    enabled: true
    size: 50Gi

maidan:
  secretFiles:
    # The bundled stores' credentials, as files (see values.yaml).
    extra:
      - name: "{{ .Release.Name }}-datastores"
        keys:
          - DATABASE_URL
          - S3_ACCESS_KEY_ID
          - S3_SECRET_ACCESS_KEY
  replicaCount: 2
  # The chart refuses a production render without a release tag or digest, so
  # this names both the registry and the release (the same pin as
  # helm/maidan/values-prod.yaml; scripts/check-deploy-pins.sh keeps them equal).
  # Prefer `--set maidan.image.digest=sha256:…`. `IfNotPresent`: a pinned tag
  # has nothing to re-pull, and `Always` on a re-pointed tag would change the
  # running version on a pod restart.
  production: true
  image:
    repository: ghcr.io/david-engelmann/maidan-server
    tag: v412.0.0
    pullPolicy: IfNotPresent
  # Artifacts live in MinIO, and a ReadWriteOnce volume cannot follow replicas
  # onto other nodes.
  persistence:
    enabled: false
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: maidan.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: maidan-tls
        hosts:
          - maidan.example.com
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
