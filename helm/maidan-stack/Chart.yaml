apiVersion: v2
name: maidan-stack
description: Maidan server with optional Postgres and MinIO (Cluster 32)
type: application
version: 0.1.0
appVersion: "0.31.0"
dependencies:
  - name: maidan
    version: 0.1.0
    repository: file://../maidan
  - name: postgresql
    version: 15.5.38
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: minio
    version: 14.8.5
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
