# Kind / CI smoke: the stack with its own Postgres and MinIO, on the locally
# built maidan-server:dev and maidan-postgres:dev. The content KEK is passed at
# install time (scripts/helm-install-kind-smoke.sh), which waits for
# /health/ready (the migrations ran on pgvector and the artifact bucket answers)
# and checks that the dev admin token below resolves.
postgresql:
  enabled: true
  image:
    repository: maidan-postgres
    tag: dev
    pullPolicy: Never
  primary:
    persistence:
      enabled: true
      size: 1Gi

minio:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi

maidan:
  secretFiles:
    # The bundled stores' credentials, as files (see values.yaml).
    extra:
      - name: "{{ .Release.Name }}-datastores"
        keys:
          - DATABASE_URL
          - S3_ACCESS_KEY_ID
          - S3_SECRET_ACCESS_KEY
  image:
    repository: maidan-server
    tag: dev
    pullPolicy: Never
  persistence:
    enabled: false
  config:
    # Opens the first workspace with this admin token, so the smoke can make an
    # authenticated call. In config, not secrets: the server reads it only from
    # the environment, and it is a published CI value, not a secret.
    MAIDAN_DEV_ADMIN_TOKEN: "maidan-dev-admin-token-local-stacks-only"
  secrets:
    # The server always authenticates, so it signs resume tokens with this.
    MAIDAN_SESSION_SECRET: "ci-kind-session-secret-0123456789abcdef"
