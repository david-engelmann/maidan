{{- if or .Values.postgresql.enabled .Values.minio.enabled }}
{{- $labels := dict "ctx" . "name" "maidan-stack" "component" "datastores" }}
# The credentials the server connects to this chart's stores with. The server
# reads them as files (maidan.secretFiles.extra names each key), or through
# maidan.extraEnvFrom when maidan.secretFiles.enabled is false.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maidan-stack.datastores.secretName" . }}
  labels:
    {{- include "maidan-stack.labels" $labels | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- $auth := .Values.postgresql.auth }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" (include "maidan-stack.urlEscape" $auth.username) (include "maidan-stack.urlEscape" $auth.password) (include "maidan-stack.postgresql.fullname" .) (include "maidan-stack.urlEscape" $auth.database) | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  S3_ACCESS_KEY_ID: {{ .Values.minio.auth.rootUser | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.minio.auth.rootPassword | quote }}
  {{- end }}
{{- end }}
{{- if .Values.minio.enabled }}
---
# Where the bundled MinIO is. Not secret, so the server reads it through
# maidan.extraEnvFrom, after its own ConfigMap, overriding maidan.config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "maidan-stack.datastores.secretName" . }}
  labels:
    {{- include "maidan-stack.labels" (dict "ctx" . "name" "maidan-stack" "component" "datastores") | nindent 4 }}
data:
  ARTIFACT_BACKEND: "s3"
  S3_ENDPOINT: {{ printf "http://%s:9000" (include "maidan-stack.minio.fullname" .) | quote }}
  S3_BUCKET: {{ first (fromJsonArray (include "maidan-stack.minio.buckets" .)) | quote }}
  S3_REGION: "us-east-1"
{{- end }}
