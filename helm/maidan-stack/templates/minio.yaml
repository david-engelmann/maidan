{{- if .Values.minio.enabled }}
{{- $minio := .Values.minio }}
{{- $name := include "maidan-stack.minio.fullname" . }}
{{- $labels := dict "ctx" . "name" "minio" "component" "object-store" }}
{{- /* Rollout nonce, not a password hash. The pod annotation is sha256 of
       this value. A cluster-connected upgrade reuses the live Secret's nonce
       while its root user and password still match, and mints a new one when
       they do not, which rolls MinIO. lookup is empty for `helm template` and
       before the Secret exists: those renders use the fixed nonce "stable",
       so applying the same manifests again does not roll MinIO. An offline
       credential change does not change it either; restart the StatefulSet,
       or upgrade with Helm connected to the cluster. */}}
{{- $nonce := "stable" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $data := $existing.data }}
{{- if $data }}
{{- $oldUser := index $data "root-user" }}
{{- $oldPass := index $data "root-password" }}
{{- $oldNonce := index $data "rollout-nonce" }}
{{- if and $oldUser $oldPass }}
{{- if and (eq ($oldUser | b64dec) (toString $minio.auth.rootUser)) (eq ($oldPass | b64dec) (toString $minio.auth.rootPassword)) }}
{{- if $oldNonce }}
{{- $nonce = $oldNonce | b64dec }}
{{- end }}
{{- else }}
{{- $nonce = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* volumeClaimTemplates are immutable. When the StatefulSet is already in
       the cluster, refuse a change of enabled, size, or storageClass instead
       of sending an update Kubernetes will reject. helm template has no live
       object, so it cannot refuse. */}}
{{- $live := lookup "apps/v1" "StatefulSet" .Release.Namespace $name }}
{{- if $live }}
{{- if eq ($live.kind | toString) "StatefulSet" }}
{{- $claims := $live.spec.volumeClaimTemplates }}
{{- $persist := dict "on" false "size" "" "class" "" "other" false }}
{{- if $claims }}
{{- range $claims }}
{{- if .metadata }}
{{- if eq (.metadata.name | toString) "data" }}
{{- $_ := set $persist "on" true }}
{{- if .spec }}
{{- if .spec.resources }}
{{- if .spec.resources.requests }}
{{- $stored := index .spec.resources.requests "storage" }}
{{- if $stored }}
{{- $_ := set $persist "size" ($stored | toString) }}
{{- end }}
{{- end }}
{{- end }}
{{- if .spec.storageClassName }}
{{- $_ := set $persist "class" (.spec.storageClassName | toString) }}
{{- end }}
{{- end }}
{{- else }}
{{- $_ := set $persist "other" true }}
{{- end }}
{{- else }}
{{- $_ := set $persist "other" true }}
{{- end }}
{{- end }}
{{- end }}
{{- $gate := dict "bad" false }}
{{- if ne ($persist.on | toString) ($minio.persistence.enabled | toString) }}
{{- $_ := set $gate "bad" true }}
{{- end }}
{{- if and $persist.on $minio.persistence.enabled }}
{{- if or (ne ($persist.size | toString) ($minio.persistence.size | toString)) (ne ($persist.class | toString) ($minio.persistence.storageClass | toString)) }}
{{- $_ := set $gate "bad" true }}
{{- end }}
{{- end }}
{{- if and $persist.other (not $persist.on) }}
{{- $_ := set $gate "bad" true }}
{{- end }}
{{- if index $gate "bad" }}
{{- $extra := "" }}
{{- if and $persist.other (not $persist.on) }}
{{- $extra = " The live StatefulSet has a volume claim not named data, so this chart will not adopt it." }}
{{- end }}
{{- fail (printf "minio.persistence cannot change on StatefulSet %s: Kubernetes rejects updates that add, remove, or edit volumeClaimTemplates (enabled, size, or storageClass). Live persistence=%s size=%q class=%q; this upgrade asks for enabled=%s size=%q class=%q.%s Copy the buckets out with mc mirror, delete the StatefulSet with --cascade=orphan, and delete PVC data-%s-0 when the new pod needs a new volume (persistence on or off, or another storage class). Upgrade again and copy the buckets back. Growing a volume, when the storage class allows expansion, is a change to that PVC: leave size unchanged. Steps: helm/maidan-stack/README.md. Replacing the old Bitnami MinIO chart is separate: docs/Production.md." $name ($persist.on | toString) ($persist.size | toString) ($persist.class | toString) ($minio.persistence.enabled | toString) ($minio.persistence.size | toString) ($minio.persistence.storageClass | toString) $extra $name) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "maidan-stack.labels" $labels | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ $minio.auth.rootUser | quote }}
  root-password: {{ $minio.auth.rootPassword | quote }}
  # The client image has no shell, so the bucket Job's alias is this variable.
  mc-host: {{ printf "http://%s:%s@%s:9000" $minio.auth.rootUser $minio.auth.rootPassword $name | quote }}
  # Not a credential. The StatefulSet annotation is a hash of this, so a
  # credential change rolls MinIO without publishing a password hash.
  rollout-nonce: {{ $nonce | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "maidan-stack.labels" $labels | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
  selector:
    {{- include "maidan-stack.selectorLabels" $labels | nindent 4 }}
---
# Governs the StatefulSet's pod identity; clients use the Service above.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | trunc 60 | trimSuffix "-" }}-hl
  labels:
    {{- include "maidan-stack.labels" $labels | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: api
      port: 9000
      targetPort: api
  selector:
    {{- include "maidan-stack.selectorLabels" $labels | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "maidan-stack.labels" $labels | nindent 4 }}
spec:
  serviceName: {{ $name | trunc 60 | trimSuffix "-" }}-hl
  replicas: 1
  selector:
    matchLabels:
      {{- include "maidan-stack.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "maidan-stack.labels" $labels | nindent 8 }}
      annotations:
        # Secret-backed env vars are read at container start, so a credential
        # change must change the pod template to roll MinIO. This is sha256 of
        # the Secret key rollout-nonce, not of the root user or password.
        checksum/rollout-nonce: {{ $nonce | sha256sum | quote }}
    spec:
      # MinIO is configured by MINIO_* variables; keep Kubernetes from adding
      # its own for every Service named minio-*.
      enableServiceLinks: false
      # Chainguard's MinIO runs as uid 65532; fsGroup makes the volume writable.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: {{ include "maidan-stack.image" (dict "image" $minio.image "path" "minio.image") | quote }}
          imagePullPolicy: {{ $minio.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml $minio.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not $minio.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if $minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "maidan-stack.selectorLabels" $labels | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $minio.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $minio.persistence.size }}
  {{- end }}
{{- end }}
