# Line-coverage floors, enforced by the `coverage (llvm-cov)` CI job through
# scripts/coverage-floors.py. Coverage counts the whole suite (unit and
# integration tests, Postgres under testcontainers).
#
# Floors are per crate, not one blanket percentage: a regression in a small,
# security-critical crate (auth, fsm, router, types) cannot hide behind the
# size of the server or the store, and a crate that is thin today is a
# recorded gap, not a number the rest of the workspace pads out.
#
# Each floor sits just under the crate's measured coverage: the measurement
# rounded down to the half point after taking one point off, which clears the
# run-to-run jitter seen on `main` (at most 0.7 points, in maidan-search).
# Measured on CI run 36435128021 (2026-09-28). Raise a floor when a crate's
# coverage rises; lowering one needs a reason in the PR that does it.

[workspace]
lines = 85.5 # measured 86.66

[crates]
maidan-a2a = 80.0           # 81.38
maidan-artifacts = 61.5     # 62.50 on run 36461416048, once the MinIO tests ran
maidan-auth = 92.5          # 93.92
