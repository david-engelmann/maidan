# Line-coverage floors, enforced by the `coverage (llvm-cov)` CI job through
# scripts/coverage-floors.py. Coverage counts the whole suite (unit and
# integration tests, Postgres under testcontainers).
#
# Floors are per crate, not one blanket percentage: a regression in a small,
# security-critical crate (auth, fsm, router, types) cannot hide behind the
# size of the server or the store, and a crate that is thin today is a
# recorded gap, not a number the rest of the workspace pads out.
#
# Each floor sits just under the crate's measured coverage: the lowest of
# three runs, rounded down to the half point after taking one point off. The
# lowest of three clears run-to-run jitter, which reached 1.7 points in
# maidan-cli across the three runs below.
# Measured on the coverage job of `main` CI runs 43060492563, 42978179970 and
# 42965976876 (2026-11-11); the comment after each floor is the lowest of the
# three. Raise a floor when a crate's coverage rises; lowering one needs a
# reason in the PR that does it. maidan-env and maidan-mcp sit above what the
# rule gives today (97.0, 92.0) and were left, not lowered.

[workspace]
lines = 91.0 # measured 92.04

[crates]
maidan-a2a = 89.5           # 90.56
maidan-artifacts = 75.0     # 76.07; helpers.rs (90 lines, no caller) is 0%
maidan-auth = 95.5          # 96.66
maidan-bus = 91.0           # 92.35
maidan-cli = 88.0           # 89.45 (91.14 on run 43060492563)
maidan-env = 98.0           # 98.10
maidan-fsm = 97.0           # 98.11
maidan-mcp = 92.5           # 93.23
maidan-observability = 81.5 # 82.78; OTLP init runs in the otlp smoke job, outside coverage
maidan-router = 97.0        # 98.43
maidan-search = 86.5        # 87.60
maidan-server = 86.5        # 87.74
maidan-store = 93.0         # 94.34
maidan-types = 95.5         # 96.77
maidan-wasi = 82.5          # 83.54
