# Accepted advisories for the `osv scan` CI job (scripts/osv-scan.sh), which
# checks the lockfiles cargo-deny does not read: fuzz/, ui-tests/ and the SDKs
# under sdk/. The root Cargo.lock is cargo-deny's, and its accepted advisories
# live in deny.toml.
#
# Every entry names the lockfile it is for and why the advisory does not apply
# there. An id listed here is accepted in every lockfile the job scans, so a
# new lockfile that carries the same advisory needs its own reason added here.

[[IgnoredVulns]]
# fuzz/Cargo.lock. `rsa` is locked only because `sqlx-mysql` is; no fuzz
# target enables MySQL, so `cargo tree --manifest-path fuzz/Cargo.toml -i rsa
# --target all -e all --all-features` prints nothing, and the fuzz crate is
# never shipped. No fixed `rsa` release exists (the root lockfile accepts the
# same advisory in deny.toml for the OIDC RS256 path).
id = "RUSTSEC-2023-0071"
reason = "fuzz/Cargo.lock: rsa is locked through sqlx-mysql but compiled into no fuzz target; no fixed release"

# fuzz/Cargo.lock and sdk/rust/Cargo.lock. webpki-roots 0.26.11 is a shim
# that re-exports webpki-roots 1.x, locked at the fixed 1.0.10 in both; the
# roots it bundles are 1.0.10's.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0381"
reason = "fuzz/Cargo.lock, sdk/rust/Cargo.lock: webpki-roots 0.26.11 is a shim over webpki-roots 1.x, locked at the fixed 1.0.10 (RustSec lists 0.26.11 as unaffected, so cargo-deny needs no ignore)"

# fuzz/Cargo.lock and sdk/rust/Cargo.lock. block-buffer 0.10.4 is the buffer
# under the digest 0.10 hashers (sha1 for the SDK's WebSocket handshake, sha2
# in the fuzz build). The advisory needs the hasher's compress callback to
# panic, the panic to be caught, and the buffer to be used again; the
# RustCrypto compress functions do not panic, and neither the fuzz targets nor
# the SDK catch a panic around a hasher. Only 0.12.1 is fixed, and no 0.10
# release exists, so the fix arrives when the hashers move to digest 0.11.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "fuzz/Cargo.lock, sdk/rust/Cargo.lock: block-buffer 0.10.4 under digest 0.10 hashers whose compress never panics, and nothing catches a hasher panic; no fixed 0.10 release"

# examples/openhands/requirements.txt. litellm (every release through
# 1.106.6) pins filelock<4.0, and the filelock advisories keep coming, fixed
# only in 4.x, so no floor satisfies both. filelock there guards the example's
# own lock files in a single-user Linux container. Revisit by the date, or
# sooner when litellm allows filelock 4.
[[PackageOverrides]]
name = "filelock"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-12-31T00:00:00Z
reason = "examples/openhands/requirements.txt: litellm pins filelock<4.0 and every filelock advisory is fixed only in 4.x; the example runs as the only user in a Linux container it owns"
