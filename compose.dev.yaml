name: maidan-dev

# Dev compose stack — same Postgres + MinIO + maidan-server stack as
# `compose.yaml`, but maidan-server is built from `Dockerfile.dev` and
# mounts the workspace as a volume for cargo-watch hot reload.
#
# Usage:
#   docker compose -f compose.dev.yaml up
#
# To run only Postgres + MinIO (so cargo run drives the server locally):
#   docker compose -f compose.dev.yaml up postgres minio

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    image: maidan-postgres:dev
    container_name: maidan-dev-postgres
    environment:
      POSTGRES_USER: maidan
      POSTGRES_PASSWORD: maidan
      POSTGRES_DB: maidan
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maidan -d maidan"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: maidan-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: maidan
      MINIO_ROOT_PASSWORD: maidanmaidan
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  maidan-server:
    build:
      context: .
      dockerfile: crates/maidan-server/Dockerfile.dev
    container_name: maidan-dev-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://maidan:maidan@postgres:5432/maidan
      ARTIFACT_BACKEND: localfs
      ARTIFACT_LOCALFS_ROOT: /data/artifacts
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: debug,sqlx=info,hyper=info
      CARGO_TARGET_DIR: /var/cache/maidan/target
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - dev_cargo_target:/var/cache/maidan/target
      - dev_cargo_registry:/usr/local/cargo/registry
      - dev_maidan_data:/data

volumes:
  dev_postgres_data:
  dev_minio_data:
  dev_cargo_target:
  dev_cargo_registry:
  dev_maidan_data:
