name: maidan-quickstart

# One-command local evaluation stack. Runs a
# single Maidan server on SQLite + local-filesystem artifacts, bound to loopback.
#
# Default-secure: authentication is ON, exactly like production. Seed the first admin
# and mint a bearer token with `maidan init` (bundled in the image), then use it:
#
#   docker compose -f compose.quickstart.yaml up -d --build --wait
#   docker compose -f compose.quickstart.yaml exec maidan maidan init --workspace demo
#   MAIDAN_TOKEN=<token> MAIDAN_WORKSPACE=<workspace-id>./scripts/quickstart-two-agents.sh
#
# MAIDAN_BOOTSTRAP=1 keeps the unauthenticated member-seed route open so the demo can
# create its two agents; content operations (post/read) require the token. To explore
# without minting a token (local only), layer compose.quickstart.insecure.yaml on top.
# Never expose this to a network or use it in production. For a hardened deployment use
# compose.yaml (Postgres + object store) or the Helm chart.
services:
  maidan:
    build:
      context: docker
      dockerfile: Dockerfile.quickstart
      args:
        MAIDAN_VERSION: ${MAIDAN_VERSION:-v410.0.0}
    environment:
      DATABASE_URL: sqlite:///data/maidan.db?mode=rwc
      ARTIFACT_BACKEND: localfs
      ARTIFACT_LOCALFS_ROOT: /data/artifacts
      # Auth is ON. Dev-only HMAC key for signed session/resume tokens (32+ bytes) —
      # replace for any real deployment.
      MAIDAN_SESSION_SECRET: "quickstart-dev-session-secret-32bytes"
      # Keep the unauthenticated seed routes (workspace/member create) open so the demo
      # can create its two agents. Unset this once a real deployment has its admin.
      MAIDAN_BOOTSTRAP: "1"
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: info,sqlx=warn
    # Loopback-only by design. The host port is overridable because 8080 is
    # commonly already taken; a conflict would fail the whole `up`.
    ports:
      - "127.0.0.1:${MAIDAN_HOST_PORT:-8080}:8080"
    volumes:
      - maidan_quickstart_data:/data
    restart: unless-stopped
    healthcheck:
      # `docker compose up -d --wait` then returns when the server is serving,
      # so the very next command in the walkthrough cannot race the boot.
      #
      # curl, not `maidan-server --health-check` like compose.yaml uses. This
      # image runs a **released** binary (MAIDAN_VERSION), so it cannot be
      # assumed to know about a flag added after that release — and an older one
      # ignores the flag and starts a second server, which fails on the port and
      # marks the container unhealthy forever. The image has curl; the
      # distroless one compose.yaml builds does not, which is why they differ.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

volumes:
  maidan_quickstart_data:
