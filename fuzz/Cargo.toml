[package]
name = "maidan-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
chrono = "0.4"
libfuzzer-sys = "0.4"
maidan-a2a = { path = "../crates/maidan-a2a" }
maidan-auth = { path = "../crates/maidan-auth" }
maidan-mcp = { path = "../crates/maidan-mcp" }
maidan-types = { path = "../crates/maidan-types" }
serde = "1"
serde_json = "1"
uuid = "1"

# Its own workspace: the fuzz crate builds with nightly and sanitizers, and is
# not one of the repo's member crates.
[workspace]
members = ["."]

[[bin]]
name = "egress_target"
path = "fuzz_targets/egress_target.rs"
test = false
doc = false
bench = false

[[bin]]
name = "room_uri"
path = "fuzz_targets/room_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "waiter_result"
path = "fuzz_targets/waiter_result.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_type_id"
path = "fuzz_targets/event_type_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_key"
path = "fuzz_targets/content_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_request"
path = "fuzz_targets/mcp_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "a2a_request"
path = "fuzz_targets/a2a_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "a2a_page_token"
path = "fuzz_targets/a2a_page_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_subscribe"
path = "fuzz_targets/ws_subscribe.rs"
test = false
doc = false
bench = false
