name: maidan

# Default compose stack — builds the production image from
# `crates/maidan-server/Dockerfile` and a custom Postgres image with the
# pgvector extension. Schema is applied at runtime by maidan-server's
# migration runner, not baked into the image (see docker/Dockerfile.db).
#
# Usage:
#   docker compose up                    # postgres only
#   docker compose --profile full up     # + maidan-server
#   docker compose --profile federation up  # postgres + maidan-a + maidan-b
#   docker compose --profile scale up    # postgres + minio + 2 replicas + LB
#
# For hot-reload dev, see `compose.dev.yaml`.

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    image: maidan-postgres:dev
    container_name: maidan-postgres
    environment:
      POSTGRES_USER: maidan
      POSTGRES_PASSWORD: maidan
      POSTGRES_DB: maidan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maidan -d maidan"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    # MinIO's own images stopped being pullable (Docker Hub, then quay.io,
    # 401 from 2026-09-24), so the server comes from Chainguard's build, pinned
    # by digest because its free tier only publishes :latest. It runs as uid
    # 65532 and bundles `mc`, so the healthcheck is unchanged.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: maidan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: maidan
      MINIO_ROOT_PASSWORD: maidanmaidan
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - full

  minio-init:
    # The client image has no shell; `MC_HOST_local` defines the alias.
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    container_name: maidan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://maidan:maidanmaidan@minio:9000
    command: ["mb", "--ignore-existing", "local/maidan"]
    profiles:
      - full

  maidan-server:
    build:
      context: .
      dockerfile: crates/maidan-server/Dockerfile
    image: maidan-server:dev
    container_name: maidan-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://maidan:maidan@postgres:5432/maidan
      ARTIFACT_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: maidan
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: maidan
      S3_SECRET_ACCESS_KEY: maidanmaidan
      # Smoke-only secret for subscribe resume tokens + future session signing.
      MAIDAN_SESSION_SECRET: "smoke-compose-session-secret-32bytes!"
      # Postgres profile runs the embedding indexer; mark readiness degraded if silent 5m.
      INDEXER_STALE_SECS: "300"
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: info,sqlx=warn
    # 8080 is one of the most contended ports on a dev machine, and a bind
    # conflict here fails the whole `up`, so the host side is overridable.
    # Container-to-container consumers need no published port at all.
    ports:
      - "${MAIDAN_HOST_PORT:-8080}:8080"
    volumes:
      - maidan_data:/data
    healthcheck:
      # The runtime image is distroless — no shell, no curl. The binary probes
      # its own /health/ready, so `--wait` and `depends_on: service_healthy`
      # gate on the server actually serving rather than on the container existing.
      test: ["CMD", "/usr/local/bin/maidan-server", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - full

  maidan-a:
    build:
      context: .
      dockerfile: crates/maidan-server/Dockerfile
    image: maidan-server:dev
    container_name: maidan-a
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://maidan:maidan@postgres:5432/maidan
      ARTIFACT_BACKEND: localfs
      ARTIFACT_LOCALFS_ROOT: /data/artifacts
      AUTH_DISABLED: 1
      MAIDAN_ALLOW_INSECURE_NO_AUTH: 1
      FEDERATION_DISABLED: 1
      # Peers in this profile are other containers on the compose network —
      # private addresses the egress guard refuses unless told otherwise.
      MAIDAN_ALLOW_PRIVATE_EGRESS: 1
      # Smoke-only 32-byte key (hex); required to register federation peers.
      FEDERATION_ENCRYPTION_KEY: "4242424242424242424242424242424242424242424242424242424242424242"
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: info,sqlx=warn
    ports:
      - "${MAIDAN_HOST_PORT:-8080}:8080"
    volumes:
      - maidan_a_data:/data
    restart: on-failure:5
    healthcheck:
      # The runtime image is distroless — no shell, no curl. The binary probes
      # its own /health/ready, so `--wait` and `depends_on: service_healthy`
      # gate on the server actually serving rather than on the container existing.
      test: ["CMD", "/usr/local/bin/maidan-server", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - federation

  maidan-b:
    build:
      context: .
      dockerfile: crates/maidan-server/Dockerfile
    image: maidan-server:dev
    container_name: maidan-b
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://maidan:maidan@postgres:5432/maidan
      ARTIFACT_BACKEND: localfs
      ARTIFACT_LOCALFS_ROOT: /data/artifacts
      AUTH_DISABLED: 1
      MAIDAN_ALLOW_INSECURE_NO_AUTH: 1
      FEDERATION_DISABLED: "0"
      MAIDAN_ALLOW_PRIVATE_EGRESS: 1
      FEDERATION_ENCRYPTION_KEY: "4242424242424242424242424242424242424242424242424242424242424242"
      FEDERATION_POLL_INTERVAL_SECS: "3"
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: info,sqlx=warn
    ports:
      - "${MAIDAN_PEER_HOST_PORT:-8081}:8080"
    volumes:
      - maidan_b_data:/data
    restart: on-failure:5
    healthcheck:
      # The runtime image is distroless — no shell, no curl. The binary probes
      # its own /health/ready, so `--wait` and `depends_on: service_healthy`
      # gate on the server actually serving rather than on the container existing.
      test: ["CMD", "/usr/local/bin/maidan-server", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - federation

  # --- scale-out smoke: two replicas behind a round-robin LB ---
  # Both share one Postgres (NOTIFY fabric + durable state) and one object store
  # (S3/MinIO), so any request can land on either replica. Identical
  # MAIDAN_SESSION_SECRET so subscribe-resume tokens validate cross-replica.
  #
  # Its own MinIO with NO published host ports — replicas reach it over the
  # compose network, so the harness never collides with host ports (locally or
  # in CI) and is fully isolated from the `full` profile's minio.
  minio-scale:
    # MinIO's own images stopped being pullable (Docker Hub, then quay.io,
    # 401 from 2026-09-24), so the server comes from Chainguard's build, pinned
    # by digest because its free tier only publishes :latest. It runs as uid
    # 65532 and bundles `mc`, so the healthcheck is unchanged.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: maidan-minio-scale
    command: server /data
    environment:
      MINIO_ROOT_USER: maidan
      MINIO_ROOT_PASSWORD: maidanmaidan
    volumes:
      - minio_scale_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - scale

  minio-scale-init:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    container_name: maidan-minio-scale-init
    depends_on:
      minio-scale:
        condition: service_healthy
    environment:
      MC_HOST_local: http://maidan:maidanmaidan@minio-scale:9000
    command: ["mb", "--ignore-existing", "local/maidan"]
    profiles:
      - scale

  maidan-r1:
    build:
      context: .
      dockerfile: crates/maidan-server/Dockerfile
    image: maidan-server:dev
    container_name: maidan-r1
    depends_on:
      postgres:
        condition: service_healthy
      minio-scale:
        condition: service_healthy
      minio-scale-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://maidan:maidan@postgres:5432/maidan
      ARTIFACT_BACKEND: s3
      S3_ENDPOINT: http://minio-scale:9000
      S3_BUCKET: maidan
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: maidan
      S3_SECRET_ACCESS_KEY: maidanmaidan
      MAIDAN_SESSION_SECRET: "smoke-compose-session-secret-32bytes!"
      AUTH_DISABLED: "1"
      MAIDAN_ALLOW_INSECURE_NO_AUTH: "1"
      INDEXER_STALE_SECS: "300"
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: info,sqlx=warn
    restart: on-failure:5
    healthcheck:
      # The runtime image is distroless — no shell, no curl. The binary probes
      # its own /health/ready, so `--wait` and `depends_on: service_healthy`
      # gate on the server actually serving rather than on the container existing.
      test: ["CMD", "/usr/local/bin/maidan-server", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - scale

  maidan-r2:
    build:
      context: .
      dockerfile: crates/maidan-server/Dockerfile
    image: maidan-server:dev
    container_name: maidan-r2
    depends_on:
      postgres:
        condition: service_healthy
      minio-scale:
        condition: service_healthy
      minio-scale-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://maidan:maidan@postgres:5432/maidan
      ARTIFACT_BACKEND: s3
      S3_ENDPOINT: http://minio-scale:9000
      S3_BUCKET: maidan
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: maidan
      S3_SECRET_ACCESS_KEY: maidanmaidan
      MAIDAN_SESSION_SECRET: "smoke-compose-session-secret-32bytes!"
      AUTH_DISABLED: "1"
      MAIDAN_ALLOW_INSECURE_NO_AUTH: "1"
      INDEXER_STALE_SECS: "300"
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: info,sqlx=warn
    restart: on-failure:5
    healthcheck:
      # The runtime image is distroless — no shell, no curl. The binary probes
      # its own /health/ready, so `--wait` and `depends_on: service_healthy`
      # gate on the server actually serving rather than on the container existing.
      test: ["CMD", "/usr/local/bin/maidan-server", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - scale

  lb:
    image: nginx:1.27-alpine
    container_name: maidan-lb
    depends_on:
      maidan-r1:
        condition: service_healthy
      maidan-r2:
        condition: service_healthy
    # Host port is overridable (MAIDAN_SCALE_LB_PORT) so the harness survives a
    # local collision; CI uses the 8090 default.
    ports:
      - "${MAIDAN_SCALE_LB_PORT:-8090}:8080"
    volumes:
      - ./docker/nginx-scale.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - scale

  # --- OTLP end-to-end smoke: server pushes traces + metrics to
  # a real OpenTelemetry Collector. The collector's debug exporter logs received
  # telemetry to stdout so scripts/otlp-smoke.sh can assert delivery. localfs +
  # AUTH_DISABLED keep the profile lean (no MinIO); postgres is the shared base.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: maidan-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    profiles:
      - otlp

  maidan-otlp:
    build:
      context: .
      dockerfile: crates/maidan-server/Dockerfile
    image: maidan-server:dev
    container_name: maidan-otlp
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://maidan:maidan@postgres:5432/maidan
      ARTIFACT_BACKEND: localfs
      ARTIFACT_LOCALFS_ROOT: /data/artifacts
      AUTH_DISABLED: "1"
      MAIDAN_ALLOW_INSECURE_NO_AUTH: "1"
      INDEXER_STALE_SECS: "300"
      # Export both signals to the collector; short interval so the smoke is fast.
      OTLP_ENDPOINT: http://otel-collector:4317
      OTLP_METRICS: "1"
      OTLP_METRICS_INTERVAL_SECS: "2"
      OTLP_SERVICE_NAME: maidan-otlp-smoke
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: info,sqlx=warn
    ports:
      - "${MAIDAN_OTLP_PORT:-8082}:8080"
    volumes:
      - maidan_otlp_data:/data
    restart: on-failure:5
    healthcheck:
      # The runtime image is distroless — no shell, no curl. The binary probes
      # its own /health/ready, so `--wait` and `depends_on: service_healthy`
      # gate on the server actually serving rather than on the container existing.
      test: ["CMD", "/usr/local/bin/maidan-server", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - otlp

volumes:
  postgres_data:
  minio_data:
  minio_scale_data:
  maidan_data:
  maidan_a_data:
  maidan_b_data:
  maidan_otlp_data:
