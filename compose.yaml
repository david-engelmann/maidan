name: maidan

# Default compose stack — builds the production image from
# `crates/maidan-server/Dockerfile` and a custom Postgres image with the
# pgvector extension + schema 0001 baked in.
#
# Usage:
#   docker compose up               # postgres + minio
#   docker compose --profile full up # + maidan-server
#
# For hot-reload dev, see `compose.dev.yaml`.

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    image: maidan-postgres:dev
    container_name: maidan-postgres
    environment:
      POSTGRES_USER: maidan
      POSTGRES_PASSWORD: maidan
      POSTGRES_DB: maidan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maidan -d maidan"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: maidan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: maidan
      MINIO_ROOT_PASSWORD: maidanmaidan
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: maidan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 maidan maidanmaidan &&
      mc mb --ignore-existing local/maidan
      "
    profiles:
      - full

  maidan-server:
    build:
      context: .
      dockerfile: crates/maidan-server/Dockerfile
    image: maidan-server:dev
    container_name: maidan-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://maidan:maidan@postgres:5432/maidan
      ARTIFACT_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: maidan
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: maidan
      S3_SECRET_ACCESS_KEY: maidanmaidan
      MAIDAN_BIND: 0.0.0.0:8080
      MAIDAN_LOG: info,sqlx=warn
    ports:
      - "8080:8080"
    volumes:
      - maidan_data:/data
    profiles:
      - full

volumes:
  postgres_data:
  minio_data:
  maidan_data:
