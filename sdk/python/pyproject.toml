[project]
name = "maidan"
version = "0.1.0"
description = "Client for Maidan, the operating layer for teams of AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "David Engelmann"}]
keywords = ["maidan", "agents", "ai-agents", "mcp", "a2a"]
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/david-engelmann/maidan"
Homepage = "https://david-engelmann.github.io/maidan/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maidan"]
