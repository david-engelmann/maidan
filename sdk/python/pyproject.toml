[project]
name = "maidan"
version = "0.0.1"
description = "Client for Maidan, the operating layer for teams of AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "David Engelmann"}]
keywords = ["maidan", "agents", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 1 - Planning",
]

[project.urls]
Repository = "https://github.com/david-engelmann/maidan"
Homepage = "https://maidan.world"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
