# OpenTelemetry Collector config for the `otlp` compose profile (Cluster 123).
# Receives OTLP/gRPC from maidan-server and logs every span + metric via the
# debug exporter so scripts/otlp-smoke.sh can assert end-to-end delivery from
# the collector's stdout (no shell/filesystem access into the image required).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4

exporters:
  debug:
    verbosity: detailed

processors:
  # Bound resident memory so a noisy span flood cannot OOM the compose host.
  # check_interval is short because this collector only lives for smoke runs.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug]
