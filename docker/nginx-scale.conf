# Round-robin load balancer for the two-replica scale-out smoke harness
# (Cluster 105). Fronts maidan-r1 + maidan-r2 on :8080 so e2e traffic lands on
# either replica per request — the point is correctness with no session affinity.

events {}

http {
    # Do not advertise the nginx version on error pages or the Server header.
    server_tokens off;
    # Scale-out smoke bodies stay small; refuse multi-GB uploads at the proxy.
    client_max_body_size 32m;

    # WebSocket upgrade passthrough for /subscribe streams.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream maidan_replicas {
        server maidan-r1:8080;
        server maidan-r2:8080;
    }

    server {
        listen 8080;

        # Defense-in-depth headers for the harness front door (even though it
        # is loopback-only in CI). Keep them on error responses too.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location / {
            proxy_pass http://maidan_replicas;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
