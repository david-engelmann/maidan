# Round-robin load balancer for the two-replica scale-out smoke harness
# (Cluster 105). Fronts maidan-r1 + maidan-r2 on :8080 so e2e traffic lands on
# either replica per request — the point is correctness with no session affinity.

events {}

http {
    # WebSocket upgrade passthrough for /subscribe streams.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream maidan_replicas {
        server maidan-r1:8080;
        server maidan-r2:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://maidan_replicas;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
