name: docs

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: mdbook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install repository-script dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/maidan-mcp
      - name: generate MCP reference
        run: cargo run -p maidan-mcp --bin gen-mcp-reference -- book/src/mcp-reference.md
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
      - name: install mdbook-linkcheck
        # The `[output.linkcheck]` renderer in book.toml runs during `mdbook build`
        # and fails the build on dead internal links. mdBook finds it on PATH.
        run: cargo install mdbook-linkcheck --locked --version 0.7.7
      - name: install Mermaid renderer
        run: |
          # 0.14.1 uses mdbook-preprocessor 0.4.x, matching mdBook 0.4.40.
          cargo install mdbook-mermaid --locked --version 0.14.1
          mdbook-mermaid install book
      - name: stage docs into book/src
        run: bash book/sync-docs.sh
      - name: build site (also runs the dead-link check)
        run: mdbook build book
      - name: verify published presentation contracts
        run: ./scripts/check-docs-presentation.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mdbook
          path: book/build
          if-no-files-found: error

  deploy:
    name: GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mdbook
          path: book/build
      - name: configure pages
        uses: actions/configure-pages@v5
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # linkcheck is a second renderer, so mdBook nests HTML under build/html
          path: book/build/html
      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@v4

  # docs.maidan.world (deploy/cloudflare/wrangler.docs.jsonc). Off until the
  # repository variable DOCS_DOMAIN is "true", which is set once the DNS record
  # exists (docs/Production.md, "The docs site"). The site is rebuilt with
  # site-url "/" because the domain serves it from the root, not /maidan/.
  docs-domain:
    name: docs.maidan.world
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_DOMAIN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prod
      url: https://docs.maidan.world
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MDBOOK_OUTPUT__HTML__SITE_URL: /
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/maidan-mcp
      - name: generate MCP reference
        run: cargo run -p maidan-mcp --bin gen-mcp-reference -- book/src/mcp-reference.md
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
      - name: install mdBook renderers
        run: |
          cargo install mdbook-linkcheck --locked --version 0.7.7
          cargo install mdbook-mermaid --locked --version 0.14.1
          mdbook-mermaid install book
      - name: build site for the domain root
        run: bash book/sync-docs.sh && mdbook build book
      - name: add response headers
        run: cp deploy/cloudflare/docs-headers book/build/html/_headers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: deploy
        working-directory: deploy/cloudflare
        run: npm ci && npx wrangler deploy -c wrangler.docs.jsonc
