name: deploy prod
# The cut release workflow finds this run by its name.
run-name: deploy prod ${{ github.event.release.tag_name || inputs.tag }}

# maidan.world runs a release on Cloudflare Containers (deploy/cloudflare/,
# wrangler.prod.jsonc; docs/Hosted Operations.md). Publishing a
# GitHub Release deploys it; a dispatch deploys a named tag, to roll back or
# forward. The image is the release's own, cosign-verified, never a build of
# main. Before a deploy the prod database is snapshotted to a Neon branch; a
# release that fails its checks is replaced by the one that was running.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vN.N.N)"
        required: true

# One deploy at a time; a newer one waits rather than racing the rollout.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: https://maidan.world
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ghcr.io/david-engelmann/maidan-server
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEONDB_ADMIN_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID_PROD }}
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      # Before the checkout, deploy/cloudflare does not exist yet, so this
      # step runs at the workspace root (the default directory below is
      # for the later steps).
      - name: the tag is a release tag
        working-directory: .
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # main is prod: a release tag deploys only when its commit is on main,
      # which only a promotion from dev moves.
      - name: the tag is on main
        working-directory: .
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main \
            || { echo "$TAG is not on main; promote it from dev first" >&2; exit 1; }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
      # What to go back to if this release fails its checks. Only a release
      # tag counts: an instance that answers nothing has nothing to restore.
      - name: the release running now
        run: |
          prev=$(curl -fsS https://maidan.world/health | jq -r .version || true)
          if [[ "$prev" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$prev" != "$TAG" ]]; then
            echo "PREV=$prev" >> "$GITHUB_ENV"
            echo "maidan.world runs $prev"
          else
            echo "maidan.world answers ${prev:-nothing}; no earlier release to restore"
          fi
      # A copy-on-write branch of the prod database, named for the release,
      # so data a migration damages can be read back. The three newest are
      # kept; older pre-deploy branches are removed so the project stays
      # under its branch limit. Without the Neon secrets the deploy goes on
      # with a warning.
      - name: snapshot the prod database
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::no Neon credential in the prod environment; deploying $TAG without a database snapshot"
            exit 0
          fi
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          auth="Authorization: Bearer $NEON_API_KEY"
          name="pre-deploy-$TAG-$(date -u +%Y%m%d%H%M)"
          curl -fsS -X POST "$api" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"branch\":{\"name\":\"$name\"}}" > /dev/null
          echo "snapshot: Neon branch $name"
          # A failed cleanup leaves an extra branch, not a reason to stop.
          { curl -fsS "$api" -H "$auth" \
              | jq -r '[.branches[] | select(.name | startswith("pre-deploy-"))] | sort_by(.created_at) | reverse | .[3:][] | .id' \
              | while read -r id; do curl -fsS -X DELETE "$api/$id" -H "$auth" > /dev/null; done; } \
            || echo "::warning::could not remove older pre-deploy branches"
      # Verify, push, deploy and check /health and an anonymous /me
      # (deploy-release.sh). DEPLOYING tells the rollback that prod changed.
      - name: deploy
        run: |
          echo "DEPLOYING=1" >> "$GITHUB_ENV"
          ./deploy-release.sh "$TAG"
      - name: roll back to the release that was running
        if: failure() && env.DEPLOYING == '1' && env.PREV != ''
        run: |
          ./deploy-release.sh "$PREV"
          echo "::error::$TAG failed its checks; maidan.world is back on $PREV"
