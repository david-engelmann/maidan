name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # `-C debuginfo=line-tables-only` keeps file:line for panics/coverage but
  # drops the bulk of debug info, which otherwise bloats the large e2e test
  # binaries and exhausts the runner's linker (recurring `ld` SIGBUS / core
  # dump while linking maidan-server test targets).
  RUSTFLAGS: -D warnings -C debuginfo=line-tables-only

jobs:
  # Decides whether a change touches anything but documentation. On a
  # docs-only pull request the heavy jobs below are skipped with a job-level
  # `if` (GitHub reports a job skipped by `if` as successful, so a required
  # check still passes), and integration runs only the tests that read the
  # docs. Pushes to main, manual runs and any code change run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation: docs/, book/, and Markdown anywhere. Everything
          # else (code, workflows, scripts, deploy files, openapi) is code.
          changed="$(git diff --name-only "$BASE" HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(docs/|book/)|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change: heavy jobs skip"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (fmt + clippy + deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Release-stream truth is derived from the real tag set.
          fetch-depth: 0
      - name: install repository-script dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: no unwrap/expect in library/binary code
        # Scoped to --lib --bins so it covers crates/*/src only; test modules
        # (#[cfg(test)]) aren't compiled here, and tests/ + benches are excluded.
        run: cargo clippy --workspace --lib --bins -- -D clippy::unwrap_used -D clippy::expect_used
      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: deny check
        run: cargo deny check
      - name: helm template smoke
        run: ./scripts/helm-template-smoke.sh
      - name: deployment contract
        run: ./scripts/check-deploy-contract.sh
      - name: agent contract golden files
        run: ./scripts/check-agent-contract.sh

  helm-kind:
    name: helm install (kind)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: helm install kind smoke
        run: bash scripts/helm-install-kind-smoke.sh

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: build
        # Only lib+bin targets: the test/bench binaries are compiled by the
        # `lint` (clippy --all-targets) and `integration` (nextest --tests)
        # jobs, so linking them here too is redundant and a needless source of
        # linker pressure.
        run: cargo build --workspace --lib --bins
      - name: test (unit only)
        # Profiles live in .config/nextest.toml; `ci` runs every test, applies
        # the slow-test timeout and writes a JUnit report.
        run: cargo nextest run --workspace --lib --bins --profile ci
      - name: upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  a2a-tck:
    name: a2a tck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs the official A2A TCK (pinned in scripts/a2a-tck.sh) against a
    # source-built server over the JSON-RPC, HTTP+JSON and gRPC bindings. Fails on any
    # TCK failure, a stale exclusion, or a pass count below the recorded floor.
    # Not a required check (docs/Decisions.md); the binding behaviour is also
    # gated by the required Rust e2e tests.
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: a2a tck
        run: scripts/a2a-tck.sh

  loom:
    name: loom
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Model-checks every interleaving of the sharded bus and the presence hub
    # (the `loom` feature swaps in loom's locks). Not a required check
    # (docs/Decisions.md).
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: bus models
        run: cargo test -p maidan-bus --features loom --release --lib loom
      - name: presence models
        run: cargo test -p maidan-server --features loom --release --lib loom

  mcp-inspector:
    name: mcp inspector (report-only)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Boots a source-built server with auth enabled and runs the official MCP
    # Inspector (built on the official TypeScript SDK) against it — an external
    # client oracle the in-repo MCP tests cannot be, because they agree with the
    # server by construction. This is how the SDK's failed handshake was found.
    # Report-only (continue-on-error) and NOT a required check: the behavior is
    # gated by the required Rust e2e tests (mcp_streamable_e2e, mcp_e2e); a new
    # Inspector release should never block a merge before it is triaged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          # The Inspector requires Node >= 22.19.
          node-version: "22"
      - name: mcp external verifier
        run: scripts/mcp-inspector.sh

  tla:
    name: tla
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Model-checks the TLA+ specs in specs/tla with TLC (pinned in
    # scripts/tla.sh). Not a required check (docs/Decisions.md).
    steps:
      - uses: actions/checkout@v4
      - name: set up java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: tlc
        run: scripts/tla.sh

  osv-scan:
    name: osv scan (lockfiles outside cargo-deny)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # osv-scanner (pinned in scripts/osv-scan.sh) over every lockfile that
    # cargo-deny does not read: fuzz/, ui-tests/, sdk/go and a fresh resolution
    # of the Rust SDK. Fails on any advisory not accepted, with its reason, in
    # .config/osv-scanner.toml. Not a required check (docs/Decisions.md): a new
    # advisory can turn it red with no change in this repo.
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: osv-scanner
        run: scripts/osv-scan.sh

  sdk-interop:
    name: sdk interop (report-only)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Boots a source-built server (SQLite, auth disabled) and runs each client
    # SDK's black-box suite against it (scripts/sdk-test.sh). Report-only
    # (continue-on-error) and NOT a required check: the server behavior the SDKs
    # exercise is already gated by the required Rust e2e tests; this job proves the
    # four clients interop end-to-end, without ever blocking a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: install pytest
        run: python -m pip install pytest
      - name: build server (warm the cache for the suites)
        run: cargo build --bin maidan-server
      - name: typescript
        run: scripts/sdk-test.sh typescript
      - name: python
        run: scripts/sdk-test.sh python
      - name: go
        run: scripts/sdk-test.sh go
      - name: rust
        run: scripts/sdk-test.sh rust

  integration:
    name: integration (testcontainers)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: integration tests
        if: needs.changes.outputs.code == 'true'
        run: cargo nextest run --workspace --tests --profile ci
      - name: doc contract tests (docs-only change)
        # The tests that read docs/, book/ or Markdown; nothing else can be
        # affected by a docs-only change.
        if: needs.changes.outputs.code != 'true'
        run: >-
          cargo nextest run --workspace --tests --profile ci -E
          'binary(docs_numbers_contract) | binary(mcp_reference_current) |
          binary(alert_templates_contract) | binary(result_delivery_e2e) |
          binary(token_pack) | binary(openapi_well_formed)'
      - name: upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  sqlite-vec:
    name: sqlite-vec (optional feature)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: default build omits sqlite-vec
        run: |
          cargo build -p maidan-search -p maidan-server --all-targets
          if cargo tree -p maidan-search -e normal -i sqlite-vec 2>/dev/null | grep -q .; then
            echo "::error::sqlite-vec must not be in the normal dependency tree without --features"
            cargo tree -p maidan-search -e normal -i sqlite-vec
            exit 1
          fi
      - name: test with sqlite-vec feature
        run: |
          cargo test -p maidan-search --features sqlite-vec
          cargo test -p maidan-server --features sqlite-vec --test search_semantic_e2e -- sqlite_http_semantic

  bootstrap-strip:
    name: bootstrap compile-time strip
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A release build: 10–11 min on an idle runner, over 15 on a busy one,
    # where it was killed mid-compile on three PRs in a day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: release build and e2e without bootstrap feature
        run: |
          cargo build -p maidan-server --release --no-default-features
          cargo test -p maidan-server --no-default-features --test bootstrap_absent_e2e
      - name: build and run the release CLI image
        env:
          MAIDAN_VERSION: ci
        run: |
          cargo build -p maidan-cli --release
          mkdir -p target/cli-image
          cp target/release/maidan target/cli-image/maidan
          cp docker/Dockerfile.cli target/cli-image/Dockerfile
          docker build --build-arg MAIDAN_VERSION=ci -t maidan-cli:ci target/cli-image
          test "$(docker image inspect maidan-cli:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
          test "$(docker image inspect maidan-cli:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "ci"
          test "$(docker run --rm maidan-cli:ci --version)" = "maidan ci"

  coverage:
    name: coverage (llvm-cov)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Coverage gates on the WHOLE test suite (unit + integration), so the
    # number reflects code actually exercised — most store/server logic is
    # covered by integration tests, not inline units. Postgres-backed tests
    # need a Docker daemon (testcontainers), same as the `integration` job.
    # The job fails when the workspace or any crate drops under its floor in
    # .config/coverage-floors.toml. It is not a required check (see
    # docs/Decisions.md, "Coverage floors are per crate and advisory").
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install nextest + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: test the floor check
        run: python3 scripts/test-coverage-floors.py
      - name: drop instrumented binaries from the restored cache
        # The report reads every test binary under the target dir. One
        # restored from an older commit's cache adds that commit's lines again,
        # all uncovered, which pulled maidan-store from 88.5% to 81.4% on a
        # stale cache.
        run: cargo llvm-cov clean --workspace
      - name: run instrumented test suite
        run: cargo llvm-cov nextest --workspace --profile ci --no-report
      - name: lcov + html
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html
      - name: line coverage floors
        run: python3 scripts/coverage-floors.py lcov.info
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            lcov.info
            coverage-html
      - name: upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false

  e2e:
    name: docker compose smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: validate quickstart stack
        # No network/build: guards the one-command quickstart files from bit-rot
        # (compose validity + build-context/dockerfile resolution + script syntax).
        # The full end-to-end (pulls a pinned release binary) is verified locally.
        run: |
          docker compose -f compose.quickstart.yaml config -q
          docker compose -f compose.quickstart.yaml -f compose.quickstart.insecure.yaml config -q
          bash -n scripts/quickstart-two-agents.sh
          bash -n scripts/release-image-smoke.sh
          # Guard the demo scripts + MCP configs from bit-rot
          # (the full two-language lease demo is verified locally via scripts/lease-demo.sh).
          bash -n scripts/lease-demo.sh
          node --check examples/lease_demo/claim.mjs
          python3 -m py_compile examples/lease_demo/lease_demo.py examples/langchain_maidan.py examples/autogen_maidan.py examples/rest_maidan.py scripts/eval-land-gate-advisor.py
          python3 -c "import json,sys; [json.load(open(f)) for f in ['examples/cursor-mcp.json','examples/claude-desktop-mcp.json']]; print('mcp configs valid')"
      - name: build images
        run: |
          docker build \
            --build-arg MAIDAN_ENABLE_BOOTSTRAP=1 \
            -t maidan-server:dev \
            -f crates/maidan-server/Dockerfile .
          docker build -t maidan-postgres:dev -f docker/Dockerfile.db .
      # `--wait` blocks on the services' own health checks, so this step is
      # also what proves those health checks work.
      - name: compose up
        run: docker compose --profile full up -d --wait
      - name: health reports ok
        run: |
          curl -sf http://localhost:8080/health > /tmp/health.json
          cat /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json
      - name: compose logs on failure
        if: failure()
        run: |
          echo "=== maidan-server ==="
          docker compose --profile full logs maidan-server || true
          echo "=== postgres ==="
          docker compose --profile full logs postgres || true
          echo "=== minio ==="
          docker compose --profile full logs minio || true
      - name: compose down
        if: always()
        run: docker compose --profile full down -v
      - name: federation compose up
        run: docker compose --profile federation up -d --wait
      - name: federation push smoke
        run: bash scripts/federation-smoke.sh
      - name: federation pull smoke
        env:
          MAIDAN_A_PEER_URL: http://maidan-a:8080
        run: bash scripts/federation-pull-smoke.sh
      - name: federation compose logs on failure
        if: failure()
        run: |
          echo "=== maidan-a ==="
          docker compose --profile federation logs maidan-a || true
          echo "=== maidan-b ==="
          docker compose --profile federation logs maidan-b || true
      - name: federation compose down
        if: always()
        run: docker compose --profile federation down -v

  scale-out-smoke:
    # Required check as of the `maidan-scale-1.0` gate.
    # Two replicas behind an LB sharing one Postgres + object store, exercising
    # the REST cross-replica paths. WS/notify/presence/OAuth cross-replica are
    # covered by the in-process two_replica_*_e2e tests.
    # NOTE: also add "scale-out smoke" to branch-protection required checks.
    name: scale-out smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: two-replica scale-out smoke
        run: bash scripts/scale-out-smoke.sh

  pitr-drill:
    # Base backup + WAL archive restored to a chosen moment, against the
    # maidan-postgres image as built from this tree. `pg_dump` alone gives no
    # recovery point between dumps; this is the evidence the PITR procedure in
    # docs/Production.md works. Not (yet) a required check.
    name: pitr drill
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build maidan-postgres
        run: docker build -f docker/Dockerfile.db -t maidan-postgres:ci docker
      - name: point-in-time recovery drill
        run: bash scripts/pitr-drill.sh maidan-postgres:ci

  sqlite-backup-drill:
    # The SQLite half of backup and restore: a VACUUM INTO snapshot taken while
    # a writer runs, restored over a killed server's database and an orphaned
    # -wal. Evidence for the SQLite procedure in docs/Production.md. Not
    # required.
    name: sqlite backup drill
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: install sqlite3
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: SQLite backup and restore drill
        run: bash scripts/sqlite-backup-drill.sh

  alert-rules:
    # Executes the SLO recording/alert PromQL with promtool — lints expressions
    # and templates (`check rules`) and runs the unit tests (`test rules`). The
    # alert_templates_contract test only checks metric *names*; this catches
    # expression bugs (e.g. an `and` ordering that humanizes the wrong $value).
    # Required check as (v124.0.0).
    name: promtool (alert rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install promtool
        run: |
          set -euo pipefail
          VER=3.12.0
          SHA=20da47f8e5303f74aecb78edd7f7e39041dac08ac4939dba75efd7a900ae8867
          URL="https://github.com/prometheus/prometheus/releases/download/v${VER}/prometheus-${VER}.linux-amd64.tar.gz"
          # GitHub release downloads occasionally return an HTML error page
          # (`gzip: not in gzip format`). Retry + checksum so a required check
          # does not fail on a transient non-tarball body.
          for attempt in 1 2 3 4; do
            if curl -fL --retry 3 --retry-delay 2 -o /tmp/prom.tar.gz "$URL" \
              && echo "${SHA}  /tmp/prom.tar.gz" | sha256sum -c -; then
              break
            fi
            echo "promtool download attempt ${attempt} failed; retrying" >&2
            rm -f /tmp/prom.tar.gz
            if [ "$attempt" -eq 4 ]; then
              echo "failed to download a valid prometheus v${VER} tarball" >&2
              exit 1
            fi
            sleep $((attempt * 4))
          done
          tar -xzf /tmp/prom.tar.gz -C /tmp
          sudo install "/tmp/prometheus-${VER}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version
      - name: check + unit-test SLO rules
        run: ./scripts/check-alert-rules.sh

  otlp-smoke:
    # End-to-end OTLP: maidan-server pushes traces + metrics to a real
    # OpenTelemetry Collector, and the smoke asserts the collector received both.
    # Proves the OTLP export wiring against a collector, not just the
    # in-process metrics_push unit test.
    # Required check as (v124.0.0).
    name: otlp smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: |
          docker build \
            --build-arg MAIDAN_ENABLE_BOOTSTRAP=1 \
            -t maidan-server:dev \
            -f crates/maidan-server/Dockerfile .
          docker build -t maidan-postgres:dev -f docker/Dockerfile.db .
      - name: otlp end-to-end smoke
        run: bash scripts/otlp-smoke.sh
      - name: collector logs on failure
        if: failure()
        run: |
          echo "=== otel-collector ==="
          docker compose --profile otlp logs otel-collector || true
          echo "=== maidan-otlp ==="
          docker compose --profile otlp logs maidan-otlp || true

  replica-routing:
    # LSN causal read-replica routing against REAL
    # streaming replication. `scripts/replica-harness.sh` stands up a primary +
    # hot-standby pair on the host Docker daemon (its ports map to localhost, so
    # the cargo test process reaches them directly — no dind). The three routing
    # tests are `#[ignore]`d + env-gated, so they run only here with the two URLs
    # set; unset elsewhere they skip. Closes the "LSN routing is CI-untested"
    # gap. Not a required check yet.
    name: replica routing (LSN)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: bring up a primary + streaming standby
        run: |
          eval "$(scripts/replica-harness.sh up)"
          {
            echo "MAIDAN_PRIMARY_URL=$MAIDAN_PRIMARY_URL"
            echo "MAIDAN_REPLICA_URL=$MAIDAN_REPLICA_URL"
          } >> "$GITHUB_ENV"
      - name: LSN read-your-write routing tests (real streaming replication)
        run: |
          cargo test -p maidan-store  --test replication    -- --ignored --nocapture
          cargo test -p maidan-store  --test read_routing    -- --ignored --nocapture
          cargo test -p maidan-search --test replica_routing -- --ignored --nocapture
      - name: tear down the harness
        if: always()
        run: scripts/replica-harness.sh down

  ui-tests:
    name: ui tests (playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Real headless-Chromium coverage of the /ui console. The example harness
    # (crates/maidan-server/examples/ui_test_server.rs) seeds an in-memory server
    # and serves the real /ui; Playwright drives it in a browser. This catches
    # DOM / render / event-wiring bugs the static ui_js_contract check cannot.
    # See ui-tests/README.md.
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build the /ui test harness
        run: cargo build --example ui_test_server -p maidan-server
      - name: install node deps
        working-directory: ui-tests
        run: npm ci
      - name: install chromium
        working-directory: ui-tests
        run: npx playwright install --with-deps chromium
      - name: run playwright
        working-directory: ui-tests
        run: npx playwright test
      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui-tests/playwright-report/
          retention-days: 7
