name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  COVERAGE_MIN_LINES: "11.0"

jobs:
  lint:
    name: lint (fmt + clippy + deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: deny check
        run: cargo deny check
      - name: helm template smoke
        run: ./scripts/helm-template-smoke.sh

  helm-kind:
    name: helm install (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: helm install kind smoke
        run: bash scripts/helm-install-kind-smoke.sh

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-targets
      - name: test (unit only)
        run: cargo test --workspace --lib --bins

  integration:
    name: integration (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: integration tests
        run: cargo nextest run --workspace --tests --no-fail-fast

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: coverage report + line gate
        run: |
          cargo llvm-cov --workspace --lib --bins --fail-under-lines "$COVERAGE_MIN_LINES" --lcov --output-path lcov.info
          cargo llvm-cov --workspace --lib --bins --html --output-dir coverage-html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage-html
      - name: upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false

  e2e:
    name: docker compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: |
          docker build -t maidan-server:dev -f crates/maidan-server/Dockerfile .
          docker build -t maidan-postgres:dev -f docker/Dockerfile.db .
      - name: compose up
        run: docker compose --profile full up -d
      - name: wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /tmp/health.json; then
              cat /tmp/health.json
              jq -e '.status == "ok"' /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::health check timed out after 120s"
          exit 1
      - name: compose logs on failure
        if: failure()
        run: |
          echo "=== maidan-server ==="
          docker compose --profile full logs maidan-server || true
          echo "=== postgres ==="
          docker compose --profile full logs postgres || true
          echo "=== minio ==="
          docker compose --profile full logs minio || true
      - name: compose down
        if: always()
        run: docker compose --profile full down -v
      - name: federation compose up
        run: docker compose --profile federation up -d
      - name: federation push smoke
        run: bash scripts/federation-smoke.sh
      - name: federation pull smoke
        env:
          MAIDAN_A_PEER_URL: http://maidan-a:8080
        run: bash scripts/federation-pull-smoke.sh
      - name: federation compose logs on failure
        if: failure()
        run: |
          echo "=== maidan-a ==="
          docker compose --profile federation logs maidan-a || true
          echo "=== maidan-b ==="
          docker compose --profile federation logs maidan-b || true
      - name: federation compose down
        if: always()
        run: docker compose --profile federation down -v
