name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build release binaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin maidan-server --bin maidan --target ${{ matrix.target }}
          else
            cargo build --release --bin maidan-server --bin maidan --target ${{ matrix.target }}
          fi
      - name: package
        run: |
          mkdir -p dist
          tar -czf dist/maidan-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release maidan-server maidan
      - uses: actions/upload-artifact@v4
        with:
          name: maidan-${{ matrix.target }}
          path: dist/

  bundle:
    name: bundle release assets
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: download linux x86_64
        uses: actions/download-artifact@v4
        with:
          name: maidan-x86_64-unknown-linux-gnu
          path: incoming
      - name: download linux aarch64
        uses: actions/download-artifact@v4
        with:
          name: maidan-aarch64-unknown-linux-gnu
          path: incoming
      - name: download macos arm64
        uses: actions/download-artifact@v4
        with:
          name: maidan-aarch64-apple-darwin
          path: incoming
      - name: flatten tarballs
        run: |
          mkdir -p dist
          find incoming -name '*.tar.gz' -exec mv -t dist {} +
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 1

  docker-server:
    name: docker push maidan-server (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: set up qemu
        uses: docker/setup-qemu-action@v3
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: build + push maidan-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/maidan-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/maidan-server:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=maidan-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=maidan-server-${{ matrix.arch }}

  docker-server-manifest:
    name: docker manifest maidan-server
    needs: [docker-server]
    if: needs.docker-server.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: publish multi-arch tag
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE="ghcr.io/${OWNER}/maidan-server"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

  docker-postgres:
    name: docker push maidan-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: set up qemu
        uses: docker/setup-qemu-action@v3
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: build + push maidan-postgres
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maidan-postgres:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/maidan-postgres:latest
          cache-from: type=gha,scope=maidan-postgres
          cache-to: type=gha,mode=max,scope=maidan-postgres

  release:
    name: github release
    needs: [bundle]
    if: needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: list artifacts
        run: ls -la dist
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: install cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: generate SBOM
        continue-on-error: true
        run: |
          cargo cyclonedx --format json --override-filename sbom -q
          shopt -s nullglob
          for f in sbom.cdx sbom.cdx.json sbom.json; do
            if [[ -f "$f" ]]; then
              mv "$f" dist/sbom.json
              exit 0
            fi
          done
          echo "SBOM not produced; publishing tarballs only"
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: sign release artifacts (keyless / Sigstore)
        # Keyless signing via the job's GitHub OIDC identity (no private key).
        # Each artifact gets a self-verifiable `.cosign.bundle` (sig + cert +
        # Rekor proof). Verify: cosign verify-blob --bundle <f>.cosign.bundle \
        #   --certificate-identity-regexp '^https://github.com/david-engelmann/maidan' \
        #   --certificate-oidc-issuer https://token.actions.githubusercontent.com <f>
        run: |
          cd dist
          shopt -s nullglob
          for f in *.tar.gz sbom.json; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done
          ls -la
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
