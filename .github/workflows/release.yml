name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-record:
    name: release record matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # The release record distinguishes every real tag from source-only history.
          fetch-depth: 0
      - name: install release-record dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: bind source record to immutable tag
        run: ./scripts/check-release-records.sh --tag "${{ steps.tag.outputs.tag }}"

  build:
    name: build release binaries
    needs: [release-record]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: build
        env:
          # Baked into the binary's reported version (see version() in
          # maidan-server); forwarded into the cross container via Cross.toml.
          MAIDAN_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin maidan-server --bin maidan --target ${{ matrix.target }}
          else
            cargo build --release --bin maidan-server --bin maidan --target ${{ matrix.target }}
          fi
      - name: package
        run: |
          mkdir -p dist
          tar -czf dist/maidan-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release maidan-server maidan
      - uses: actions/upload-artifact@v4
        with:
          name: maidan-${{ matrix.target }}
          path: dist/

  bundle:
    name: bundle release assets
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: download linux x86_64
        uses: actions/download-artifact@v4
        with:
          name: maidan-x86_64-unknown-linux-gnu
          path: incoming
      - name: download linux aarch64
        uses: actions/download-artifact@v4
        with:
          name: maidan-aarch64-unknown-linux-gnu
          path: incoming
      - name: download macos arm64
        uses: actions/download-artifact@v4
        with:
          name: maidan-aarch64-apple-darwin
          path: incoming
      - name: flatten tarballs
        run: |
          mkdir -p dist
          find incoming -name '*.tar.gz' -exec mv -t dist {} +
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 1

  docker-server:
    name: docker push maidan-server (${{ matrix.arch }})
    needs: [release-record]
    # Each arch builds on its OWN native runner — the arm64 image
    # previously cross-built under QEMU emulation, which turned the Rust release
    # compile into a ~2 h job and dominated the release wall-clock. Public repos
    # get free `ubuntu-24.04-arm` runners, so no emulation is needed.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      # No QEMU: each matrix leg builds only its native platform.
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: build + push maidan-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/maidan-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            MAIDAN_VERSION=${{ steps.tag.outputs.tag }}
          tags: ghcr.io/${{ github.repository_owner }}/maidan-server:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=maidan-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=maidan-server-${{ matrix.arch }}

  docker-server-manifest:
    name: docker manifest maidan-server
    needs: [docker-server]
    if: needs.docker-server.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: publish multi-arch tag
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE="ghcr.io/${OWNER}/maidan-server"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

  docker-cli:
    name: docker push maidan-cli (${{ matrix.arch }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: download architecture-matched release bundle
        uses: actions/download-artifact@v4
        with:
          name: maidan-${{ matrix.target }}
          path: cli-context
      - name: prepare runtime image context
        run: |
          tar -xzf "cli-context/maidan-${{ matrix.target }}.tar.gz" -C cli-context maidan
          cp docker/Dockerfile.cli cli-context/Dockerfile
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: build + push maidan-cli
        uses: docker/build-push-action@v6
        with:
          context: cli-context
          file: cli-context/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: MAIDAN_VERSION=${{ steps.tag.outputs.tag }}
          tags: ghcr.io/${{ github.repository_owner }}/maidan-cli:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}

  docker-cli-manifest:
    name: docker manifest maidan-cli
    needs: [docker-cli]
    if: needs.docker-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: publish multi-arch tag
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE="ghcr.io/${OWNER}/maidan-cli"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

  trivy-scan:
    name: trivy image scan (${{ matrix.image }})
    needs: [docker-server-manifest, docker-cli-manifest, docker-postgres]
    if: needs.docker-server-manifest.result == 'success' && needs.docker-cli-manifest.result == 'success' && needs.docker-postgres.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: maidan-server
            skip-files: ""
          - image: maidan-cli
            skip-files: ""
          # `gosu` is the upstream entrypoint's privilege drop: a static Go
          # binary that execs postgres and never opens a socket. Its findings
          # are Go stdlib (crypto/tls, net/http) CVEs it cannot reach; they
          # are the documented false-positive class for gosu, and the fix is
          # upstream's rebuild. Everything else in the image is scanned.
          - image: maidan-postgres
            skip-files: usr/local/bin/gosu
    permissions:
      contents: read
      packages: read
    steps:
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      # Blocking: a fixable HIGH/CRITICAL in a published image stops the
      # release — `sign-images` and `release` need this job — so a known-bad
      # image is never signed or announced. The images are already pushed by
      # then; an unsigned image fails `cosign verify`, which is the check the
      # README tells operators to run.
      - name: trivy vulnerability scan
        # v0.36.0: pins its internal `setup-trivy` by commit SHA, so it can't
        # break when an upstream tag is removed — v0.28.0 pinned the since-yanked
        # `setup-trivy@v0.2.1` and failed to resolve on the v170.0.0 release run.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          skip-files: ${{ matrix.skip-files }}
          exit-code: "1"

  docker-postgres:
    name: docker push maidan-postgres
    needs: [release-record]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: set up qemu
        uses: docker/setup-qemu-action@v3
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: build + push maidan-postgres
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maidan-postgres:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/maidan-postgres:latest
          cache-from: type=gha,scope=maidan-postgres
          cache-to: type=gha,mode=max,scope=maidan-postgres

  sbom:
    name: generate image SBOMs
    needs: [docker-postgres]
    if: needs.docker-postgres.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      postgres_amd64: ${{ steps.postgres.outputs.amd64 }}
      postgres_arm64: ${{ steps.postgres.outputs.arm64 }}
    # One CycloneDX SBOM per published image. `sign-images` attests each to its
    # image digest, and `release` publishes and blob-signs them. A missing SBOM
    # fails the release: the step this replaces was `continue-on-error`, looked
    # for a root file the virtual workspace never writes, and so published no
    # SBOM on any release while the docs said it did.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: install cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: SBOMs of the server and CLI binaries
        # cargo-cyclonedx writes one SBOM beside each member's Cargo.toml. The
        # server image builds `--no-default-features` (crates/maidan-server/
        # Dockerfile) and the CLI image carries the default-feature binary from
        # `build`, so each comes from the run that matches it. The linux x86_64
        # target is a superset of the arm64 one (raw-cpuid and
        # curve25519-dalek-derive are x86-only), and cargo-cyclonedx unifies
        # features across the workspace, so the lists over-approximate the
        # binaries rather than omit anything from them.
        run: |
          mkdir -p sbom
          cargo cyclonedx --format json --target x86_64-unknown-linux-gnu --override-filename sbom -q
          mv crates/maidan-cli/sbom.json sbom/maidan-cli.cdx.json
          cargo cyclonedx --format json --target x86_64-unknown-linux-gnu --no-default-features --override-filename sbom -q
          mv crates/maidan-server/sbom.json sbom/maidan-server.cdx.json
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve postgres platform digests
        # The index's linux/amd64 and linux/arm64 manifests; the attestation
        # manifests buildx adds are platform unknown/unknown and drop out.
        id: postgres
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          IMAGE="ghcr.io/${{ github.repository_owner }}/maidan-postgres"
          RAW="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw)"
          for arch in amd64 arm64; do
            DIGEST="$(jq -r --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("expected one linux/\($arch) manifest in the index, found \(length)") end' <<<"$RAW")"
            echo "${arch}=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "${arch}_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          done
      # No Rust in this image, so cargo-cyclonedx has nothing to describe; trivy
      # lists its OS packages and binaries from the pushed image. Its packages
      # differ by architecture, so each platform's manifest gets its own SBOM:
      # one scan of the index reads only the runner's platform.
      - name: SBOM of the postgres image (linux/amd64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.postgres.outputs.amd64_ref }}
          format: cyclonedx
          output: sbom/maidan-postgres.linux-amd64.cdx.json
      - name: SBOM of the postgres image (linux/arm64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.postgres.outputs.arm64_ref }}
          format: cyclonedx
          output: sbom/maidan-postgres.linux-arm64.cdx.json
      - name: check every SBOM is CycloneDX
        run: |
          for name in maidan-server maidan-cli maidan-postgres.linux-amd64 maidan-postgres.linux-arm64; do
            jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "sbom/${name}.cdx.json" >/dev/null
          done
          ls -la sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom/
          retention-days: 1

  sign-images:
    name: cosign sign container images
    needs: [docker-server-manifest, docker-cli-manifest, docker-postgres, trivy-scan, sbom]
    if: needs.docker-server-manifest.result == 'success' && needs.docker-cli-manifest.result == 'success' && needs.docker-postgres.result == 'success' && needs.trivy-scan.result == 'success' && needs.sbom.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: sbom
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: sign images and attest their SBOMs by digest (keyless / Sigstore)
        # Keyless signing via the job's GitHub OIDC identity (no private key).
        # Resolve each tag to its immutable index digest and sign THAT, so the
        # signature can't be dodged by a later tag re-point. The SBOM is
        # attested to the same digest under the same identity; `--replace`
        # keeps a re-run from stacking a second SBOM on the digest. The server
        # and CLI SBOMs cover both platforms (see `sbom`), so each is attested
        # to the index; the postgres SBOMs are one per platform, so each is
        # attested to its platform's manifest digest instead. Verify:
        #   cosign verify ghcr.io/david-engelmann/maidan-server:<tag> \
        #     --certificate-identity-regexp \
        #     '^https://github\.com/david-engelmann/maidan/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        #   cosign verify-attestation --type cyclonedx <same image and flags>
        env:
          COSIGN_YES: "true"
          POSTGRES_AMD64: ${{ needs.sbom.outputs.postgres_amd64 }}
          POSTGRES_ARM64: ${{ needs.sbom.outputs.postgres_arm64 }}
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${{ steps.tag.outputs.tag }}"
          for name in maidan-server maidan-cli maidan-postgres; do
            IMAGE="ghcr.io/${OWNER}/${name}"
            DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
            echo "signing ${IMAGE}@${DIGEST}"
            cosign sign --yes "${IMAGE}@${DIGEST}"
            if [ "$name" != maidan-postgres ]; then
              echo "attesting sbom/${name}.cdx.json to ${IMAGE}@${DIGEST}"
              cosign attest --yes --replace --type cyclonedx \
                --predicate "sbom/${name}.cdx.json" "${IMAGE}@${DIGEST}"
            fi
          done
          attest_postgres() { # $1 = platform, $2 = its manifest digest
            [ -n "$2" ] || { echo "the sbom job resolved no $1 digest" >&2; exit 1; }
            echo "attesting sbom/maidan-postgres.$1.cdx.json to ghcr.io/${OWNER}/maidan-postgres@$2"
            cosign attest --yes --replace --type cyclonedx \
              --predicate "sbom/maidan-postgres.$1.cdx.json" "ghcr.io/${OWNER}/maidan-postgres@$2"
          }
          attest_postgres linux-amd64 "$POSTGRES_AMD64"
          attest_postgres linux-arm64 "$POSTGRES_ARM64"

  published-image-smoke:
    name: published server + CLI boot smoke
    needs: [docker-server-manifest, docker-cli-manifest, docker-postgres]
    if: needs.docker-server-manifest.result == 'success' && needs.docker-cli-manifest.result == 'success' && needs.docker-postgres.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: boot published images and authenticate
        run: scripts/release-image-smoke.sh "${{ steps.tag.outputs.tag }}" "${{ github.repository_owner }}"

  release:
    name: github release
    needs: [bundle, published-image-smoke, sign-images]
    if: needs.bundle.result == 'success' && needs.published-image-smoke.result == 'success' && needs.sign-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: download SBOMs
        # The same files `sign-images` attested to the image digests.
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: dist
      - name: list artifacts
        run: ls -la dist
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: sign release artifacts (keyless / Sigstore)
        # Keyless signing via the job's GitHub OIDC identity (no private key).
        # Each artifact gets a self-verifiable `.cosign.bundle` (sig + cert +
        # Rekor proof). Verify: cosign verify-blob --bundle <f>.cosign.bundle \
        #   --certificate-identity-regexp \
        #     '^https://github\.com/david-engelmann/maidan/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$' \
        #   --certificate-oidc-issuer https://token.actions.githubusercontent.com <f>
        run: |
          cd dist
          shopt -s nullglob
          for f in *.tar.gz *.cdx.json; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done
          ls -la
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
