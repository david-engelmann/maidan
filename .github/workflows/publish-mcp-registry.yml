name: publish MCP registry

# Publishes listings/registry/server.json to the official MCP registry as
# io.github.david-engelmann/maidan (Open Work Next 11): the hosted remote at
# maidan.world and the signed server image. A publish is public, so this runs
# by hand only, once the maidan-launch-1.0 gate has passed on the release the
# entry names (the maintainer's go, 2026-11-14), and only when the dispatcher
# types the release it means. GitHub's OIDC token proves the io.github
# namespace; no secret is involved.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "The release the entry names, typed out to confirm (e.g. v454.0.0)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: publish the registry entry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUBLISHER_VERSION: v1.8.7
      PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the entry names the release typed
        run: |
          # The entry's version is the release without its v; the image pin
          # is the tag itself. A mismatch means the dispatch named a release
          # this commit does not list.
          python3 - <<'PY'
          import json, os, sys
          entry = json.load(open("listings/registry/server.json"))
          release = os.environ["RELEASE"]
          versions = {entry["version"]} | {p["version"] for p in entry["packages"]}
          if versions != {release.removeprefix("v"), release}:
              sys.exit(f"listings/registry/server.json names {sorted(versions)}, not {release}")
          print(f"publishing {entry['name']} at {release}")
          PY
      - name: install mcp-publisher
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: publish
        # mcp-publisher reads server.json from the working directory.
        working-directory: listings/registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
