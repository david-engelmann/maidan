name: deploy dev

# dev.maidan.world runs the `dev` branch on Cloudflare Containers (deploy/cloudflare/,
# docs/Hosted Operations.md). Every push to dev that changes
# the server builds the image and deploys it. A pull request that changes the
# deploy itself builds the image only, so a broken Dockerfile or Worker shows
# before it reaches dev.

on:
  push:
    branches: [dev]
    paths:
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deploy/cloudflare/**"
      - ".github/workflows/deploy-dev.yml"
  pull_request:
    paths:
      - "deploy/cloudflare/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

# A newer dev supersedes a deploy still building; dev runs the newest.
concurrency:
  group: deploy-dev-${{ github.event_name == 'pull_request' && github.ref || 'dev' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: image (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: version
        id: version
        run: echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      # Cloudflare Containers run linux/amd64 only. The release cache scope
      # warms the dependency layers; the dev scope keeps the rest.
      - name: build maidan-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/maidan-server/Dockerfile
          platforms: linux/amd64
          build-args: |
            MAIDAN_VERSION=${{ steps.version.outputs.version }}
          tags: maidan-server:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/maidan-server.tar
          cache-from: |
            type=gha,scope=maidan-server-dev
            type=gha,scope=maidan-server-amd64
          cache-to: type=gha,mode=max,scope=maidan-server-dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maidan-server-image
          path: ${{ runner.temp }}/maidan-server.tar
          retention-days: 3

  worker:
    name: worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: [image, worker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: https://dev.maidan.world
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maidan-server-image
          path: ${{ runner.temp }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
      - name: push the image to the account registry
        run: |
          docker load --input "$RUNNER_TEMP/maidan-server.tar"
          npx wrangler containers push "maidan-server:$GITHUB_SHA"
      - name: deploy
        run: |
          image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/maidan-server:$GITHUB_SHA"
          sed -i \
            -e "s#\"image\": \"../../crates/maidan-server/Dockerfile\"#\"image\": \"$image\"#" \
            -e '/"image_build_context"/d' \
            wrangler.jsonc
          grep -q "\"image\": \"$image\"" wrangler.jsonc
          # How long dev goes unanswered across this deploy, measured beside
          # it (docs/Hosted Operations.md, "Deploys without downtime"). The
          # runner keeps the process across steps until the job ends.
          bash ../../scripts/measure-deploy-gap.sh --origin https://dev.maidan.world \
            --until-version "dev-${GITHUB_SHA::8}" --for 600 > "$RUNNER_TEMP/deploy-gap.txt" 2>&1 &
          # A first deploy creates the Durable Object and the container
          # application together, and the application can look for the
          # namespace before it is visible (DURABLE_OBJECT_NOT_FOUND). The
          # second attempt finds it.
          npx wrangler deploy || { sleep 15; npx wrangler deploy; }
      # The rollout replaces the running container, so wait until the new
      # build is the one answering, not merely until something answers.
      - name: dev runs this build
        run: |
          want="dev-${GITHUB_SHA::8}"
          for _ in $(seq 1 36); do
            got=$(curl -fsS --max-time 120 https://dev.maidan.world/health | jq -r .version || true)
            if [ "$got" = "$want" ]; then echo "dev.maidan.world runs $want"; exit 0; fi
            sleep 10
          done
          echo "dev.maidan.world still answers ${got:-nothing}, not $want" >&2
          exit 1
      # Reported, never a reason to fail: the number Open Work row 47 is
      # measured by.
      - name: the deploy's gap in /health answers
        run: |
          for _ in $(seq 1 60); do
            grep -q '^versions=' "$RUNNER_TEMP/deploy-gap.txt" && break
            sleep 1
          done
          cat "$RUNNER_TEMP/deploy-gap.txt"
          { echo "### dev.maidan.world across this deploy"; echo '```'; cat "$RUNNER_TEMP/deploy-gap.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
