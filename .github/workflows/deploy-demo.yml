name: deploy demo

# try.maidan.world, the public demo, where each visitor starts a sandbox of
# their own (deploy/cloudflare/wrangler.demo.jsonc; docs/Deploy.md
# "try.maidan.world"). release.yml dispatches this for the tag it just
# published, and a dispatch deploys a named tag. The `release: published`
# trigger does not fire for a release created with GITHUB_TOKEN, which is
# how release.yml publishes. Off until vars.DEMO_DOMAIN is 'true'.
#
# No compile: demo/Dockerfile layers the release's own cosign-verified
# maidan-server:<tag> (the stock build, no bootstrap routes) with bash and
# openssl. The server runs with MAIDAN_DEMO_SANDBOX=1 (src/demo-config.js).
#
# Cost: one basic instance that sleeps after 15 idle minutes, and a
# once-a-day cron that only destroys a running container
# (deploy/cloudflare/test/cost.test.js).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vN.N.N)"
        required: true

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEMO_DOMAIN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: demo
      url: https://try.maidan.world
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SERVER: ghcr.io/david-engelmann/maidan-server
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      # Runs before the checkout, when deploy/cloudflare does not exist yet.
      - name: the tag is a release tag
        working-directory: ${{ github.workspace }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
      # Build from the tag's own Dockerfile, entrypoint and Worker.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: the tag is on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main \
            || { echo "$TAG is not on main; promote it from dev first" >&2; exit 1; }
      - uses: sigstore/cosign-installer@v3
      # The release workflow signs the image keylessly; refuse it if it did
      # not.
      - name: verify the release image
        run: |
          cosign verify "$SERVER:$TAG" \
            --certificate-identity-regexp '^https://github\.com/david-engelmann/maidan/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
      - name: build the demo image on the verified image
        run: |
          # Pin the base to its linux/amd64 manifest digest, so the build uses
          # exactly what was verified.
          amd64() {
            docker buildx imagetools inspect "$1" --raw \
              | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest'
          }
          server="$SERVER@$(amd64 "$SERVER:$TAG")"
          docker build --platform linux/amd64 \
            --build-arg SERVER_IMAGE="$server" \
            -f demo/Dockerfile -t "maidan-demo:$TAG" ../..
      - name: push the demo image to the account registry
        run: npx wrangler containers push -c wrangler.demo.jsonc "maidan-demo:$TAG"
      - name: deploy
        run: |
          image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/maidan-demo:$TAG"
          sed -i "s#\"image\": \"registry.cloudflare.com/ACCOUNT/maidan-demo:RELEASE\"#\"image\": \"$image\"#" wrangler.demo.jsonc
          grep -q "\"image\": \"$image\"" wrangler.demo.jsonc
          # The first deploy can look for the Durable Object namespace before
          # it is visible (DURABLE_OBJECT_NOT_FOUND); the second finds it.
          npx wrangler deploy -c wrangler.demo.jsonc || { sleep 15; npx wrangler deploy -c wrangler.demo.jsonc; }
      # One request: it boots the new container once, which then sleeps after
      # 15 idle minutes.
      - name: try.maidan.world runs this release
        run: |
          for _ in $(seq 1 36); do
            got=$(curl -fsS https://try.maidan.world/health | jq -r .version || true)
            if [ "$got" = "$TAG" ]; then echo "try.maidan.world runs $TAG"; exit 0; fi
            sleep 10
          done
          echo "try.maidan.world answers ${got:-nothing}, not $TAG" >&2
          exit 1
      # The Worker serves the try page itself; this does not touch the
      # container.
      - name: the try page offers a sandbox
        run: curl -fsS https://try.maidan.world/ | grep -q 'Start a sandbox'
