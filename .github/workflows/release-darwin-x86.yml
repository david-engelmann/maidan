name: release-darwin-x86

# Optional Intel Mac binary — not part of the tag release workflow because
# Intel macOS runners can sit queued for hours and block workflow completion.
# macos-13 is retired; macos-15-intel is the supported Intel image.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (checkout ref)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-darwin-x86:
    name: build x86_64-apple-darwin tarball
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: install rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-apple-darwin
      - name: cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build
        run: cargo build --release --bin maidan-server --bin maidan --target x86_64-apple-darwin
      - name: package
        run: |
          mkdir -p dist
          tar -czf dist/maidan-x86_64-apple-darwin.tar.gz \
            -C target/x86_64-apple-darwin/release maidan-server maidan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maidan-x86_64-apple-darwin
          path: dist/
          retention-days: 7
