name: nightly

on:
  schedule:
    # 03:17 UTC every day — odd minute avoids the top-of-hour stampede.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation:
    name: mutation tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Sharded so each shard fits the timeout. Locally an auth mutant takes
        # about 6 s to build and test (about 335 of them) and a bus mutant
        # about 20 s, its suites starting Postgres (about 260); a runner is two
        # to three times slower. store has about 4,600 mutants and does not
        # finish inside the timeout in any case.
        include:
          - name: store + artifacts
            packages: --package maidan-store --package maidan-artifacts
            shard: ""
          - name: auth 1/3
            packages: --package maidan-auth
            shard: --shard 0/3
          - name: auth 2/3
            packages: --package maidan-auth
            shard: --shard 1/3
          - name: auth 3/3
            packages: --package maidan-auth
            shard: --shard 2/3
          - name: bus 1/4
            packages: --package maidan-bus
            shard: --shard 0/4
          - name: bus 2/4
            packages: --package maidan-bus
            shard: --shard 1/4
          - name: bus 3/4
            packages: --package maidan-bus
            shard: --shard 2/4
          - name: bus 4/4
            packages: --package maidan-bus
            shard: --shard 3/4
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: mutants
        run: |
          cargo mutants \
            --no-shuffle \
            --timeout 120 \
            ${{ matrix.packages }} \
            ${{ matrix.shard }} \
            --in-place \
            --output target/mutants

  bench:
    name: criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: bench store hot path
        run: cargo bench -p maidan-store --bench store_hot --no-run

  fuzz:
    name: fuzz the input parsers
    runs-on: ubuntu-latest
    # Nine targets at five minutes each, plus the sanitizer build.
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust (nightly, for the sanitizer)
        uses: dtolnay/rust-toolchain@nightly
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: five minutes per target
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            mkdir -p "corpus/$target"
            seeds=()
            if [ -d "seeds/$target" ]; then seeds=("seeds/$target"); fi
            cargo +nightly fuzz run "$target" "corpus/$target" "${seeds[@]}" -- \
              -dict=json.dict -max_total_time=300
            echo "::endgroup::"
          done
      - name: keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
