name: nightly

on:
  schedule:
    # 03:17 UTC every day — odd minute avoids the top-of-hour stampede.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      store_base:
        description: "Mutate the store code changed since this commit (default: the last commit more than 25 hours old)"
        required: false
        default: ""
      store_first_shard:
        description: "The first store shard to run, when a night's changes needed more shards than ran"
        required: false
        default: "0"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # auth, bus and artifacts are mutated whole. Each cargo-mutants step has its
  # own time limit, shorter than the job's, so a shard that runs out of time
  # still uploads what it tested and the report step fails the job (red, not
  # hidden). Missed mutants are findings, listed in the job summary; they do
  # not fail it. docs/Conventions.md ("Nightly mutation testing") has the
  # measurements.
  mutation:
    name: mutation tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        # Locally an auth mutant takes about 6 s to build and test (about 335
        # of them) and a bus mutant about 20 s, its suites starting Postgres
        # (about 260); a runner is two to three times slower. artifacts has
        # about 60.
        include:
          - name: artifacts
            packages: --package maidan-artifacts
            shard: ""
          - name: auth 1/3
            packages: --package maidan-auth
            shard: --shard 0/3
          - name: auth 2/3
            packages: --package maidan-auth
            shard: --shard 1/3
          - name: auth 3/3
            packages: --package maidan-auth
            shard: --shard 2/3
          - name: bus 1/4
            packages: --package maidan-bus
            shard: --shard 0/4
          - name: bus 2/4
            packages: --package maidan-bus
            shard: --shard 1/4
          - name: bus 3/4
            packages: --package maidan-bus
            shard: --shard 2/4
          - name: bus 4/4
            packages: --package maidan-bus
            shard: --shard 3/4
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          # Pinned: which mutants a version generates, and how it shards them,
          # change between releases.
          tool: cargo-mutants@27.1.0
      - name: mutants
        id: mutants
        timeout-minutes: 85
        run: |
          set +e
          cargo mutants \
            --no-shuffle \
            --timeout 120 \
            ${{ matrix.packages }} \
            ${{ matrix.shard }} \
            --in-place
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: report
        if: always()
        run: scripts/mutants.sh report "${{ matrix.name }}" "${{ steps.mutants.outputs.code }}"
      - name: keep the outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: ignore

  # The store has about 4,800 mutants, and a viable one relinks the store's
  # 137 test binaries and reruns its suites, which is minutes each: a whole
  # sweep is about 960 runner hours. So the nightly mutates only the store code
  # changed since the previous night, in shards of 20 (a few hours at the
  # measured rate, inside the step's 300 minutes), at most 10 of them so the
  # night fits GitHub's 20 concurrent jobs. scripts/mutants.sh plan warns when
  # a night's changes need more. docs/Conventions.md ("Nightly mutation
  # testing") has the measurements.
  mutation-store-plan:
    name: mutation plan (store)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.plan.outputs.base }}
      count: ${{ steps.plan.outputs.count }}
      total: ${{ steps.plan.outputs.total }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: plan
        id: plan
        env:
          STORE_BASE: ${{ inputs.store_base }}
          STORE_FIRST_SHARD: ${{ inputs.store_first_shard }}
        run: scripts/mutants.sh plan "$STORE_BASE" "$STORE_FIRST_SHARD"

  mutation-store:
    name: mutation tests (store shard ${{ matrix.shard }}/${{ needs.mutation-store-plan.outputs.total }})
    needs: mutation-store-plan
    if: needs.mutation-store-plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-store-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - name: mutants
        id: mutants
        timeout-minutes: 300
        env:
          BASE: ${{ needs.mutation-store-plan.outputs.base }}
          TOTAL: ${{ needs.mutation-store-plan.outputs.total }}
        run: |
          git diff "$BASE" HEAD -- crates/maidan-store/src > "$RUNNER_TEMP/store.diff"
          set +e
          # nextest stops at the first failing test; cargo test would run
          # the remaining binaries of a caught mutant one after another.
          # Round-robin spreads each file's mutants over the shards.
          cargo mutants \
            --package maidan-store \
            --in-diff "$RUNNER_TEMP/store.diff" \
            --shard "${{ matrix.shard }}/$TOTAL" \
            --sharding round-robin \
            --test-tool nextest \
            --timeout-multiplier 2 \
            --no-shuffle \
            --in-place
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: report
        if: always()
        run: scripts/mutants.sh report "store shard ${{ matrix.shard }}/${{ needs.mutation-store-plan.outputs.total }}" "${{ steps.mutants.outputs.code }}"
      - name: keep the outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-store-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore

  bench:
    name: criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: bench store hot path
        run: cargo bench -p maidan-store --bench store_hot --no-run

  fuzz:
    name: fuzz the input parsers
    runs-on: ubuntu-latest
    # Nine targets at five minutes each, plus the sanitizer build.
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust (nightly, for the sanitizer)
        uses: dtolnay/rust-toolchain@nightly
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: five minutes per target
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            mkdir -p "corpus/$target"
            seeds=()
            if [ -d "seeds/$target" ]; then seeds=("seeds/$target"); fi
            cargo +nightly fuzz run "$target" "corpus/$target" "${seeds[@]}" -- \
              -dict=json.dict -max_total_time=300
            echo "::endgroup::"
          done
      - name: keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
