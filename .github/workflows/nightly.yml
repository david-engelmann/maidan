name: nightly

on:
  schedule:
    # 03:17 UTC every day — odd minute avoids the top-of-hour stampede.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation:
    name: mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: mutants on store + artifacts
        run: |
          cargo mutants \
            --no-shuffle \
            --timeout 120 \
            --package maidan-store \
            --package maidan-artifacts \
            --in-place \
            --output target/mutants

  bench:
    name: criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: bench store hot path
        run: cargo bench -p maidan-store --bench store_hot --no-run

  fuzz:
    name: fuzz the input parsers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust (nightly, for the sanitizer)
        uses: dtolnay/rust-toolchain@nightly
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: five minutes per target
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=300
            echo "::endgroup::"
          done
      - name: keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
