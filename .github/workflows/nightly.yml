name: nightly

on:
  schedule:
    # 03:17 UTC every day — odd minute avoids the top-of-hour stampede.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation:
    name: mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: mutants on store + artifacts
        run: |
          cargo mutants \
            --no-shuffle \
            --timeout 120 \
            --package maidan-store \
            --package maidan-artifacts \
            --in-place \
            --output target/mutants

  bench:
    name: criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: bench (placeholder)
        run: |
          if [ -d bench ]; then
            cargo bench --workspace --no-fail-fast
          else
            echo "no bench/ directory yet; criterion suites land in Cluster U"
          fi
