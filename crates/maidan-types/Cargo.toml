[package]
name = "maidan-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Core domain types for Maidan."
# One integration-test binary (tests/it/main.rs, from scripts/gen-integration-main.py)
# instead of one per tests/*.rs, so the crate links once.
autotests = false

[features]
openapi = ["dep:utoipa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
base64 = "0.23"
chacha20poly1305 = "0.11"
zeroize = "1"
utoipa = { version = "6", optional = true, features = ["chrono", "uuid"] }

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

