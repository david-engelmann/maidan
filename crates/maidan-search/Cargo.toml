[package]
name = "maidan-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Full-text + vector search over Maidan messages and artifacts."

[dependencies]
maidan-types = { path = "../maidan-types" }
maidan-bus = { path = "../maidan-bus" }
maidan-store = { path = "../maidan-store" }
sha2.workspace = true
async-trait.workspace = true
chrono.workspace = true
libsqlite3-sys = { version = "0.30.1", optional = true, default-features = false, features = ["bundled"] }
pgvector = { version = "0.4", features = ["sqlx"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-stream = "0.1"
tracing.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sqlite-vec = { version = "0.1.9", optional = true }

[dev-dependencies]
maidan-store = { path = "../maidan-store" }
anyhow.workspace = true
criterion = "0.5"
serde_json.workspace = true
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
sqlite-vec = ["dep:sqlite-vec", "dep:libsqlite3-sys"]

[[test]]
name = "sqlite_vec"
path = "tests/sqlite_vec.rs"
required-features = ["sqlite-vec"]

[[bench]]
name = "search_hot"
harness = false
