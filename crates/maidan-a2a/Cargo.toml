[package]
name = "maidan-a2a"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Agent-to-Agent federation transport for Maidan."
# One integration-test binary (tests/it/main.rs, from scripts/gen-integration-main.py)
# instead of one per tests/*.rs, so the crate links once.
autotests = false

[dependencies]
maidan-types = { path = "../maidan-types" }
base64 = "0.22"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
maidan-types = { path = "../maidan-types" }
proptest = "1"
serde_json.workspace = true
uuid.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
