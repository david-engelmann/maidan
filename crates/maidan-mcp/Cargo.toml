[package]
name = "maidan-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Model Context Protocol server surface for Maidan."

[features]
# Log every MCP request and response in full, with secret-shaped keys
# redacted, on the `maidan_mcp::frame` target at debug. Dev builds only: a
# release build that enables it fails to compile.
frame-capture = []

[dependencies]
maidan-auth = { path = "../maidan-auth" }
maidan-types = { path = "../maidan-types" }
maidan-router = { path = "../maidan-router" }
maidan-store = { path = "../maidan-store" }
maidan-search = { path = "../maidan-search", default-features = false }
maidan-artifacts = { path = "../maidan-artifacts" }
maidan-bus = { path = "../maidan-bus" }
maidan-fsm = { path = "../maidan-fsm" }
async-trait.workspace = true
base64 = "0.22"
futures = "0.3"
bytes.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio.workspace = true

[dev-dependencies]
maidan-store = { path = "../maidan-store", features = ["test-support"] }
sqlx.workspace = true
tempfile = "3"
proptest = "1"
sha2.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "gen-mcp-reference"
path = "src/bin/gen_mcp_reference.rs"
