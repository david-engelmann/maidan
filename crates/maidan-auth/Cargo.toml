[package]
name = "maidan-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "AuthN/AuthZ for Maidan: tokens, capabilities, ACLs."

[dependencies]
maidan-types = { path = "../maidan-types" }
maidan-store = { path = "../maidan-store" }
metrics = "0.24"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono.workspace = true
hex = "0.4"
hmac = "0.12"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
uuid.workspace = true

[dev-dependencies]
maidan-store = { path = "../maidan-store", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
sqlx.workspace = true
chrono.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

