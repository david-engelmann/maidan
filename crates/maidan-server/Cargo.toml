[package]
name = "maidan-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Maidan HTTP + WebSocket + MCP server."

[lib]
path = "src/lib.rs"

[[bin]]
name = "maidan-server"
path = "src/main.rs"

[dependencies]
loom = { version = "0.7", optional = true }
maidan-fsm = { path = "../maidan-fsm" }
maidan-types = { path = "../maidan-types", features = ["openapi"] }
maidan-store = { path = "../maidan-store" }
maidan-artifacts = { path = "../maidan-artifacts" }
maidan-bus = { path = "../maidan-bus" }
maidan-auth = { path = "../maidan-auth" }
maidan-env = { path = "../maidan-env" }
maidan-mcp = { path = "../maidan-mcp" }
maidan-search = { path = "../maidan-search", default-features = false }
maidan-router = { path = "../maidan-router" }
maidan-a2a = { path = "../maidan-a2a" }
maidan-observability = { path = "../maidan-observability", default-features = false }
maidan-wasi = { path = "../maidan-wasi" }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures = "0.3"
tokio-stream = "0.1"
tokio.workspace = true
uuid.workspace = true
axum = { workspace = true, features = ["ws"] }
tower.workspace = true
tower-http.workspace = true
# A2A gRPC binding (§10). Versions match what the OTLP exporter already pulls
# (tonic 0.14 / prost 0.14), so no new major deps for cargo-deny. The official
# a2a.proto (v1.0.1) is compiled locally and the generated code vendored
# (no build-time protoc).
tonic = { version = "0.14", features = ["server"] }
tonic-prost = "0.14"
prost = "0.14"
# ProtoJSON for the generated messages, the same JSON the other two bindings
# speak: each gRPC call is converted to and from the shared operation types.
pbjson = "0.9"
pbjson-types = "0.9"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { version = "5", features = ["chrono", "uuid"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
metrics-util = { version = "0.20", default-features = false, features = ["layers"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
rand = "0.8"
base64 = "0.22"
urlencoding = "2"
hmac = "0.12"
sha2.workspace = true
subtle = "2"
hex = "0.4"
# GitHub App JWTs (RS256 signing). Already in the tree through rustls; chosen
# over the `rsa` crate, whose private-key operations RUSTSEC-2023-0071 covers.
ring = "0.17"
# Web Push: VAPID ES256 (p256/ecdsa) + RFC 8291 payload
# encryption (p256/ecdh + HKDF-SHA256 + AES-128-GCM). RustCrypto — no openssl.
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
hkdf = "0.12"
aes-gcm = "0.10"

redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[features]
default = ["bootstrap", "otel"]
bootstrap = []
# OpenTelemetry OTLP export. Default-on; `--no-default-features`
# builds a leaner server without the OTLP/tonic stack (plain tracing + Prometheus
# scrape stay). Forwards to the maidan-observability `otel` feature.
otel = ["maidan-observability/otel"]
sqlite-vec = ["maidan-search/sqlite-vec"]
# Full MCP frame capture for a developer reproducing a client's exchange.
# Dev builds only; see maidan-mcp's `frame-capture`.
mcp-frame-capture = ["maidan-mcp/frame-capture"]
# Swap the presence hub's lock for loom's so the `loom` model tests can
# explore its interleavings. Test-only: never enable it in a build that runs.
loom = ["dep:loom"]

[dev-dependencies]
maidan-store = { path = "../maidan-store", features = ["test-support"] }
# Hand-written WAT for the WASI slash e2e.
wat = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tempfile = "3"
tokio-tungstenite = "0.24"
# Generates the throwaway GitHub App key the tests sign with, so no private key
# is committed. Already in the tree through rustls.
aws-lc-rs = "1"
