[package]
name = "maidan-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Maidan HTTP + WebSocket + MCP server."

[lib]
path = "src/lib.rs"

[[bin]]
name = "maidan-server"
path = "src/main.rs"

[dependencies]
maidan-fsm = { path = "../maidan-fsm" }
maidan-types = { path = "../maidan-types", features = ["openapi"] }
maidan-store = { path = "../maidan-store" }
maidan-artifacts = { path = "../maidan-artifacts" }
maidan-bus = { path = "../maidan-bus" }
maidan-auth = { path = "../maidan-auth" }
maidan-mcp = { path = "../maidan-mcp" }
maidan-search = { path = "../maidan-search", default-features = false }
maidan-router = { path = "../maidan-router" }
maidan-a2a = { path = "../maidan-a2a" }
maidan-observability = { path = "../maidan-observability" }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures = "0.3"
tokio-stream = "0.1"
tokio.workspace = true
uuid.workspace = true
axum = { workspace = true, features = ["ws"] }
tower.workspace = true
tower-http.workspace = true
# A2A gRPC binding (§10). Versions match what the OTLP exporter already pulls
# (tonic 0.14 / prost 0.14), so no new major deps for cargo-deny. The proto is
# compiled locally and the generated code vendored (no build-time protoc).
tonic = { version = "0.14", features = ["server"] }
tonic-prost = "0.14"
prost = "0.14"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
metrics-util = { version = "0.20", default-features = false, features = ["layers"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
rand = "0.8"
base64 = "0.22"
urlencoding = "2"
hmac = "0.12"
sha2.workspace = true
subtle = "2"
hex = "0.4"

redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[features]
default = ["bootstrap"]
bootstrap = []
sqlite-vec = ["maidan-search/sqlite-vec"]

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tempfile = "3"
tokio-tungstenite = "0.24"
