[package]
name = "maidan-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Maidan HTTP + WebSocket + MCP server."

[lib]
path = "src/lib.rs"

[[bin]]
name = "maidan-server"
path = "src/main.rs"

[dependencies]
maidan-types = { path = "../maidan-types" }
maidan-store = { path = "../maidan-store" }
maidan-artifacts = { path = "../maidan-artifacts" }
maidan-bus = { path = "../maidan-bus" }
maidan-mcp = { path = "../maidan-mcp" }
maidan-observability = { path = "../maidan-observability" }
async-trait.workspace = true
chrono.workspace = true
futures = "0.3"
tokio.workspace = true
uuid.workspace = true
axum = { workspace = true, features = ["ws"] }
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tempfile = "3"
tokio-tungstenite = "0.24"
