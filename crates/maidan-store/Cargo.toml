[package]
name = "maidan-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Storage abstraction + Postgres/SQLite implementations for Maidan."

[dependencies]
maidan-fsm = { path = "../maidan-fsm" }
maidan-types = { path = "../maidan-types" }
async-trait.workspace = true
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "sso"] }
# No default `rustls` feature: the legacy hyper 0.14 client is not built; the
# HTTPS client comes from the shared aws-config.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
metrics = "0.24"
chrono.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
testcontainers = { version = "0.23", optional = true }

[features]
# Test-only constructors under the public development KEK, and the Docker
# check the testcontainers tests share.
test-support = ["dep:testcontainers"]

[dev-dependencies]
maidan-store = { path = ".", features = ["test-support"] }
maidan-auth = { path = "../maidan-auth" }
maidan-search = { path = "../maidan-search", default-features = false, features = ["sqlite-vec"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
anyhow.workspace = true
tempfile = "3"
criterion = "0.5"
proptest = "1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = "1"
http = "1"

[[bench]]
name = "store_hot"
harness = false
