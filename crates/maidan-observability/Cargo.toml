[package]
name = "maidan-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "OpenTelemetry + tracing setup for Maidan."

[dependencies]
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace", "metrics"] }
metrics = "0.24"
metrics-util = "0.20"
metrics-exporter-opentelemetry = "0.2"
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.32"
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["metrics", "testing"] }
