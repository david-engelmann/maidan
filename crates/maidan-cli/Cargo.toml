[package]
name = "maidan-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Operator CLI for Maidan."

[[bin]]
name = "maidan"
path = "src/main.rs"

[dependencies]
maidan-types = { path = "../maidan-types" }
maidan-store = { path = "../maidan-store" }
maidan-artifacts = { path = "../maidan-artifacts" }
maidan-search = { path = "../maidan-search" }
maidan-auth = { path = "../maidan-auth" }
maidan-mcp = { path = "../maidan-mcp" }
clap = { version = "4", features = ["derive", "env"] }
sqlx.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "stdio_smoke"
path = "tests/stdio_smoke.rs"

[[test]]
name = "reindex_smoke"
path = "tests/reindex_smoke.rs"
