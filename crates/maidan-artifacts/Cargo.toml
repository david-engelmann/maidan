[package]
name = "maidan-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Content-addressed artifact store for Maidan (LocalFs, S3)."

[dependencies]
maidan-types = { path = "../maidan-types" }
async-trait.workspace = true
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "sso"] }
aws-credential-types = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
# Without the default `rustls` feature, the legacy hyper 0.14 / rustls 0.21 /
# h2 0.3 client is not built; `default-https-client` is the hyper 1 one.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "rt-tokio"] }
bytes.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
testcontainers = "0.23"
