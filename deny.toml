[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[[advisories.ignore]]
id = "RUSTSEC-2025-0134"
reason = "rustls-pemfile unmaintained; dev-only via testcontainers/bollard"

[[advisories.ignore]]
id = "RUSTSEC-2025-0111"
reason = "tokio-tar via testcontainers build context upload; trusted CI path only"

[[advisories.ignore]]
id = "RUSTSEC-2026-0104"
reason = "rustls-webpki 0.101 via aws-sdk; CRL path unused for MinIO HTTP"

[[advisories.ignore]]
id = "RUSTSEC-2026-0099"
reason = "rustls-webpki 0.101 via aws-sdk; name constraints unused for MinIO HTTP"

[[advisories.ignore]]
id = "RUSTSEC-2026-0098"
reason = "rustls-webpki 0.101 via aws-sdk; URI name constraints unused for MinIO HTTP"

[[advisories.ignore]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error unmaintained via utoipa-gen; compile-time only, no runtime surface"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
