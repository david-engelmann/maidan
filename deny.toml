[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # rustls-pemfile is unmaintained; transitive via testcontainers/bollard
    # (dev-deps only). No code path runs in production builds. Revisit when
    # testcontainers updates.
    "RUSTSEC-2025-0134",
    # tokio-tar PAX-header parsing bug; reachable only via testcontainers
    # uploading build contexts to the local docker daemon, which is
    # trusted in the dev/CI environment. Not a production code path.
    "RUSTSEC-2025-0111",
    # rustls-webpki 0.101 via aws-sdk → hyper-rustls 0.24; CRL panic only
    # affects CRL parsing paths we do not use against MinIO HTTP. Revisit when
    # aws-smithy-http-client drops rustls 0.21.
    "RUSTSEC-2026-0104",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
