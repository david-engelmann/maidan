[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[[advisories.ignore]]
id = "RUSTSEC-2026-0440"
reason = "astral-tokio-tar is unmaintained (2026-11): a maintenance notice, and 0.6.4 has no open vulnerability advisory. It is locked only through testcontainers, which packs files for the Docker daemon in the integration tests and never unpacks an archive from anyone; no shipped binary links it. testcontainers 0.27 replaced tokio-tar 0.3.1 (RUSTSEC-2025-0111, no fixed release) with it. Drop this ignore when testcontainers moves off the crate, or at once if it gets a vulnerability advisory."

[[advisories.ignore]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5.5 (no fixed 0.5.x release; first fix is 0.7.6) via p256/p384 0.13, now reached only through openidconnect, which verifies ID-token signatures with public keys (no secret to leak). web_push moved to p256 0.14 (crypto-bigint 0.7.x, fixed) on its own, since its VAPID signing uses a long-lived server key where a timing leak would matter. Drop this ignore when openidconnect moves off p256/p384 0.13."

[[advisories.ignore]]
id = "RUSTSEC-2026-0459"
reason = "libsqlite3-sys 0.30 (bundled SQLite < 3.54) via sqlx-sqlite and maidan-search's sqlite-vec: uninitialized page-cache memory when a database is opened beside a -wal file a less trusted party wrote. Maidan opens only the operator's DATABASE_URL file and files it creates itself, never a database someone uploads. No sqlx release allows the fixed libsqlite3-sys 0.39 (0.8.6 pins ^0.30.1, 0.9.0 caps it below 0.38). Drop this ignore when sqlx allows 0.39."

[[advisories.ignore]]
id = "RUSTSEC-2026-0543"
reason = "chrono is unmaintained (2026-11): a maintenance notice, not a vulnerability; 0.4.45 has no open advisory. Every timestamp in the workspace is a chrono type, through sqlx, serde and the wire types, so moving to jiff or time is a workspace-wide change of its own, in Open Work. Drop this ignore when that lands, or at once if chrono gets a vulnerability advisory."

[[advisories.ignore]]
id = "RUSTSEC-2023-0071"
reason = "rsa via openidconnect for RS256 id_token verify; no fixed release; network timing risk accepted for OIDC (v2.0.2)"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
# Cluster 119: duplicate majors are a hard error so our first-party crates
# can't silently introduce a new one. The unavoidable duplicates all come from
# a few vendored subtrees (the AWS SDK crypto/HTTP stack and openidconnect v4)
# and cross-cutting ecosystem transitions (rustls 0.21->0.23, http 0.2->1,
# rand 0.8->0.9, windows 0.48->0.52, syn 1->2); those are quarantined below
# with the reason each is blocked upstream.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

# Whole vendored subtrees whose internal duplicate crypto/HTTP/TLS crates we
# don't control. Re-evaluate when these roots publish updates (esp.
# openidconnect v5 -> drops base64 0.21 + rsa; see docs/Dependencies.md).
skip-tree = [
    { crate = "aws-config", reason = "AWS SDK pins an older crypto/http/rustls stack (hmac, sha2, md-5, rustls 0.21, h2 0.3, hyper 0.14)" },
    { crate = "aws-sdk-s3", reason = "AWS SDK crypto stack (hmac 0.12/0.13, sha2 0.10)" },
    { crate = "openidconnect", reason = "v4 pins base64 0.21, rsa (RUSTSEC-2023-0071), oauth2->thiserror 1; clears on v5" },
    { crate = "testcontainers", reason = "dev-only (integration tests); bollard pulls its own http/base64 stack" },
]

# Cross-cutting ecosystem-transition duplicates pulled from many crates (not
# confined to one subtree), accepted until the ecosystem converges.
skip = [
    { crate = "getrandom@0.2.17", reason = "rand 0.8 / ring still on getrandom 0.2" },
    { crate = "getrandom@0.3.4", reason = "getrandom 0.2->0.4 ecosystem transition" },
    { crate = "hashbrown@0.15.5", reason = "hashbrown ecosystem transition (0.15/0.16/0.17)" },
    { crate = "hashbrown@0.16.1", reason = "hashbrown ecosystem transition" },
    { crate = "windows-sys@0.48.0", reason = "windows-sys 0.48/0.52/0.61 transition (platform shims)" },
    { crate = "windows-sys@0.52.0", reason = "windows-sys transition" },
    { crate = "itertools@0.10.5", reason = "itertools 0.10/0.13/0.14 spread (sqlx, metrics, etc.)" },
    { crate = "itertools@0.13.0", reason = "itertools transition" },
    { crate = "metrics-util@0.19.1", reason = "metrics-exporter-prometheus pulls an older metrics-util" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
